source = "exact child exits before required observation"

[windows_native_boundary]
required_posture = "CertifiedExecutable"
other_platform_posture = "CompileOnlyOrNotYetCertifiedExecutable"
capabilities = [
  "bind-window-to-exact-child-process",
  "observe-client-area-bounds-and-visibility",
  "capture-client-area-pixels-outside-product-and-egui",
  "request-normal-native-close",
  "distinguish-unsupported-platform-from-product-failure",
]

[[independent_oracle]]
id = "O01_EXTERNAL_CONSEQUENCE"
owner = "runner native-platform boundary"
observes = "child liveness, process-bound window, independent client pixels, external writes, native close, exit, and residue"

[[independent_oracle]]
id = "O02_PRODUCT_CAUSAL"
owner = "versioned pulse observation contract"
observes = "run, sequence, publication, replacement, preservation, denial family, mounted frame, and shutdown disposition"

[hostile_sequence]
steps = [
  "launch-exact-cargo-built-binary",
  "observe-first-frame-within-five-seconds",
  "bind-native-window-to-child",
  "hold-live-for-500-milliseconds-and-observe-blue",
  "atomically-edit-blue-to-green",
  "observe-typed-replacement-within-five-seconds",
  "observe-green-client-area",
  "write-stable-malformed-source",
  "observe-typed-preservation-within-five-seconds",
  "prove-same-live-green-predecessor",
  "restore-exact-canonical-bytes",
  "observe-fresh-blue-successor-within-five-seconds",
  "request-normal-native-close",
  "observe-typed-shutdown-and-successful-exit-within-five-seconds",
  "prove-zero-owned-residue",
]

[[mutation_control]]
id = "M01_PREMATURE_EXIT"
fault = "child exits after publication but before liveness hold and native capture"
must_invalidate = ["process-liveness", "process-bound-window", "external-blue"]

[[mutation_control]]
id = "M02_EVENT_ONLY"
fault = "valid envelope exists without matching child and native consequence"
must_invalidate = ["process-liveness", "process-bound-window", "external-pixels"]

[[mutation_control]]
id = "M03_PIXEL_ONLY"
fault = "expected pixels exist without matching product-issued publication"
must_invalidate = ["run-identity", "sequence", "published-generation", "mounted-frame"]

[[mutation_control]]
id = "M04_WATCHER_BYPASS"
fault = "source bytes change without production watcher delivery"
must_invalidate = ["settled-snapshot", "replacement-publication"]

[[mutation_control]]
id = "M05_WRONG_DENIAL"
fault = "malformed edit produces timeout, generic failure, or process death"
must_invalidate = ["typed-source-denial", "predecessor-preservation"]

[[mutation_control]]
id = "M06_PREDECESSOR_DRIFT"
fault = "generation, mounted frame, window, or pixels change during denial preservation"
must_invalidate = ["generation-continuity", "frame-continuity", "green-continuity"]

[[mutation_control]]
id = "M07_DIRECT_PAINT"
fault = "application-local egui drawing creates the expected pixels"
must_invalidate = ["host-derived-native-effect", "mounted-frame-correlation"]

[[mutation_control]]
id = "M08_FORCED_TERMINATION"
fault = "runner kills the process instead of requesting native close"
must_invalidate = ["normal-native-close", "typed-shutdown", "zero-residue"]

[[mutation_control]]
id = "M09_SKIPPED_PLATFORM"
fault = "required Windows lane compiles zero or ignored scenarios"
must_invalidate = ["certified-windows-execution-count"]

