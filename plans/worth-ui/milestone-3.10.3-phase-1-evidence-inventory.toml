[observation_protocol]
identity = "worth-ui.platform-pulse.lifecycle-observation"
schema_version = 1
stdout_prefix = "WORTH_UI_PLATFORM_PULSE_EVENT "
sequence_origin = 1
sequence_rule = "increase-exactly-by-one"
maximum_events = 256
maximum_encoded_bytes = 1048576
variants = [
  "ProcessStarted",
  "FirstFramePublished",
  "ReplacementPublished",
  "ReplacementDeniedPreserving",
  "ShutdownCompleted",
  "TerminalFailure",
]
forbidden_payloads = [
  "raw-source-text",
  "credentials",
  "arbitrary-debug-output",
  "unbounded-diagnostics",
]

[[typestate_transition]]
id = "T01_INSTALL"
from = "PulseExecutableWorld<Installed>"
action = "launch"
to = "PulseExecutableWorld<AwaitingFirstFrame>"

[[typestate_transition]]
id = "T02_FIRST_FRAME"
from = "PulseExecutableWorld<AwaitingFirstFrame>"
action = "observe_first_frame"
to = "PulseExecutableWorld<Published>"

[[typestate_transition]]
id = "T03_VALID_EDIT"
from = "PulseExecutableWorld<Published>"
action = "apply_valid_edit"
to = "PulseExecutableWorld<AwaitingReplacement>"

[[typestate_transition]]
id = "T04_REPLACEMENT"
from = "PulseExecutableWorld<AwaitingReplacement>"
action = "observe_replacement"
to = "PulseExecutableWorld<Published>"

[[typestate_transition]]
id = "T05_MALFORMED_EDIT"
from = "PulseExecutableWorld<Published>"
action = "apply_malformed_edit"
to = "PulseExecutableWorld<AwaitingPreservation>"

[[typestate_transition]]
id = "T06_PRESERVATION"
from = "PulseExecutableWorld<AwaitingPreservation>"
action = "observe_preserved_predecessor"
to = "PulseExecutableWorld<PreservedPredecessor>"

[[typestate_transition]]
id = "T07_RECOVERY_EDIT"
from = "PulseExecutableWorld<PreservedPredecessor>"
action = "restore_canonical_source"
to = "PulseExecutableWorld<AwaitingReplacement>"

[[typestate_transition]]
id = "T08_CLOSE"
from = "PulseExecutableWorld<Published>"
action = "close_native_window"
to = "PulseExecutableWorld<Closed>"

[[canonical_world]]
id = "W01_CANONICAL_PLATFORM_PULSE"
