schema = "worth-ui.milestone-3.14.phase-5-contract.v1"
milestone = "3.14"
phase = 5
status = "closed"
ledger = "plans/worth-ui/milestone-3.14-phase-5-proof-ledger.csv"
main_ledger = "plans/worth-ui/milestone-3.14-proof-ledger.csv"
predecessor_contract = "plans/worth-ui/milestone-3.14-phase-4-contract.toml"
closure_claim = "the permanent Platform Pulse proves one real native human action through typed UI admission, application effect, separate Query or domain admission, visible consequence, bounded causal evidence, exact cleanup, and final constitutional closure"

[authority]
native_truth = "the process-bound operating-system client sends pointer and keyboard input to the one real native window without importing WORTH UI authority"
product_input_truth = "a bounded product adapter watches the versioned intent-source root and alone translates external policy and executor-gate revisions into typed application facts"
provider_truth = "one typed application-owned provider consumes only UiIntentExecutionRequest<I> and calls a separately admitted product action port"
query_truth = "the product action port separately enters Query or domain admission and returns only owner-issued consequence authority"
publication_truth = "the existing Milestone 3.12 observation and rebind transaction publishes completed posture and Query consequence atomically"
cost_truth = "production counters and independent models prove storage and work slopes without using wall time as the semantic oracle"
census_truth = "one fixed framework-owned census covers every retained Milestone 3.14 resource family and reaches exact zero"
trace_truth = "bounded non-authoritative evidence correlates host sequence through mounted pixels while operational owners remain required"
compile_truth = "the existing two-session compile owner rejects forgery, bypass, callback residue, diagnostic readmission, and Query mutation leakage"

[destination]
pulse_root = "workspaces/worth-ui/apps/platform-pulse/src"
pulse_intent_root = "workspaces/worth-ui/apps/platform-pulse/src/intent"
pulse_input_root = "workspaces/worth-ui/apps/platform-pulse/intent_samples"
pulse_observation = "workspaces/worth-ui/apps/platform-pulse/src/observation_contract/intent.rs"
executable_world = "workspaces/worth-ui/apps/platform-pulse/tests/executable_world/courtroom/platform_pulse_intent"
cost_evidence = "workspaces/worth-ui/crates/worth-ui-certification/tests/application_contracts/intent/cost"
lifecycle_evidence = "workspaces/worth-ui/crates/worth-ui-certification/tests/application_contracts/intent/lifecycle/ia_11"
compile_owner = "scripts/ci/run_worth_ui_compile_contracts.py"
documentation_root = "workspaces/worth-ui/docs"

[limits]
transition_deadline_seconds = 5
journey_ceiling_seconds = 45
ordinary_warm_ceiling_seconds = 60
route_counts = [1, 1024, 65536]
interaction_counts = [0, 1, 16]
payload_widths = [0, 1, 64]
queue_occupancies = [0, 15, 16, 17]
compile_sessions = 2
new_test_target = false
new_binary = false
nested_cargo_invocation = false

[compile_time_enforcement]
typed_provider_payload_and_outcome = true
sealed_product_input_adapter = true
move_only_admission_attempt_and_recovery = true
diagnostic_trace_has_no_operational_conversion = true
reporting_projection_has_no_operational_conversion = true
query_consequence_requires_query_owner = true
renderer_and_adapter_cannot_execute_provider = true
string_intent_authority_is_absent = true
placeholder_callback_lane_is_absent = true
existing_compile_sessions_are_reused = true

[forbidden]
ordinary_paths = [
    "in-process substitution for the executable IA-01 world",
    "direct native-event injection into runtime or adapter state",
    "per-frame product input file reads or policy parsing",
    "renderer, adapter, or test runner provider invocation",
    "UI admission treated as Query or domain mutation authority",
    "visible completion published outside the 3.12 transaction",
    "wall-clock timing used as the only cost or ordering oracle",
    "diagnostic identity or reporting projection accepted as authority",
    "second intent queue, executor, compile target, binary, or Cargo session",
    "string command, static readiness, callback, handler, or placeholder compatibility lane",
    "ignored ordinary test used to claim required coverage",
    "milestone closure with an open IA or phase-ledger row",
]

[[phase_gate]]
id = "P5-01"
owner = "Phase 5 contract and topology"
claim = "the product-world authority split, real-world limits, destinations, compile fences, ordered gates, and closed Phase 4 handoff are mechanically frozen"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test topology_contracts milestone_314_phase5 -- --nocapture"

[[phase_gate]]
id = "P5-02"
owner = "permanent Pulse intent composition"
claim = "the checked-in Pulse declares typed routes and facts, installs one typed provider and bounded product adapter, and exposes versioned observations without adding runtime authority"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --lib intent -- --nocapture"

[[phase_gate]]
id = "P5-03"
owner = "IA-01 executable product courtroom"
claim = "one real native-window journey proves admission, held execution, completion, Query-backed consequence, confirmation staleness, denial, rebind cancellation, pixels, and exact teardown"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --features executable-world --test executable_world courtroom::platform_pulse_intent::canonical_platform_pulse_intent_reaches_visible_query_backed_consequence -- --exact --nocapture"

[[phase_gate]]
id = "P5-04"
owner = "IA-10 cost and scale"
claim = "definition and provider storage, route work, payload projection, occupancy, unchanged turns, motion storms, and activation bursts follow exact contractual slopes"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::cost::ia_10 -- --nocapture"

[[phase_gate]]
id = "P5-05"
owner = "IA-11 lifecycle census"
claim = "every retained interaction and intent resource retires exactly once across denial, cancellation, retry, replacement, repeated cleanup, and shutdown"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::lifecycle::ia_11 -- --nocapture"

[[phase_gate]]
id = "P5-06"
owner = "IA-12 bounded causal trace"
claim = "host sequence through mounted pixels is complete and bounded while equal diagnostics, stale receipts, and reporting projections open no operational door"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --features executable-world --test executable_world courtroom::platform_pulse_intent::intent_causal_trace_reaches_pixels_without_becoming_authority -- --exact --nocapture"

[[phase_gate]]
id = "P5-07"
owner = "IA-13 compile and residue closure"
claim = "valid twins compile, every authority forgery or phase bypass fails for its intended reason, and placeholder or callback compatibility residue is mechanically absent"
command = "python scripts/ci/run_worth_ui_compile_contracts.py"

[[phase_gate]]
id = "P5-08"
owner = "Milestone 3.14 final closure"
claim = "all IA and phase ledgers, continuing docs, cost lanes, executable worlds, topology, boundary, context, composition, formatting, and strict warnings are green on exact final source"
command = "cargo run --manifest-path tools/boundary-check/Cargo.toml -- --root ."
