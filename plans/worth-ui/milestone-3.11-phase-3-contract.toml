schema = "worth-ui.milestone-3.11.phase-3-contract.v1"
milestone = "3.11"
phase = 3
status = "implementation"
closure_claim = "one sealed visual snapshot owns immutable independent paint and hit-test indexes, bounded point and region adjudication, and an exact mounted-receipt-first authored identity trace"

[authority]
mounted = "prepared mounted-frame truth owns canonical paint mechanics, independently admitted hit-test mechanics, total hit order, and receipt-keyed trace basis"
host = "validated host observation owns realized mechanical geometry and never semantic identity"
runtime = "runtime visual inspection alone projects regions, builds indexes, assembles traces, accounts cost, and seals the live receipt"
inspection = "inspection contracts own non-authoritative immutable evidence meaning and typed result postures"

[cost_lanes]
ordinary = "zero visual index construction, query work, trace probes, and snapshot structural retention"
snapshot = "bounded region projection, immutable index construction, trace-index construction, and receipt sealing"
query = "bounded indexed point or region lookup against one already sealed receipt"

[[batch]]
id = "3A"
claim = "mounted truth carries distinct canonical paint and hit-test mechanics, explicit total hit order, and receipt-keyed authored trace basis"
gate = "capability, plan, mounting projection, integrity, retention, and replacement tests"

[[batch]]
id = "3B"
claim = "validated host geometry builds separate immutable visible and hit-test indexes with clipped half-open regions and bounded structural work"
gate = "focused geometry, index property, cost, truncation, and mutation-control tests"

[[batch]]
id = "3C"
claim = "public frame, node, point, and region workflows return exact typed adjudication and receipt-first traces across replacement and remount"
gate = "compile twins plus consolidated VS-03, VS-04, VS-05, and VS-08 application contracts"

[[scenario]]
id = "VS-03"
production_claim = "paint participation and hit-test participation remain independent and explicit total hit order selects the exact target"
plausible_defect = "the runtime reuses paint rows for hit testing, picks the first candidate, or falls back to incidental vector order"
world = "production-mounted overlapping painted-only, hit-only, paint-and-hit, and neither regions with independently authored participation"
semantic_handles = "mounted receipts, paint mechanics, hit mechanics, total hit orders, snapshot identity, and point scope"
production_entry = "sealed visual snapshot point adjudication"
authority_boundary = "validated host geometry joined to retained mounted mechanics and receipt-keyed trace basis"
action_schedule = "capture once and adjudicate one named point in each semantic class"
typed_expected_outcome = "four distinct visible/hit combinations with exact total-order target"
consequential_state = "querying never mutates mounted truth or the immutable snapshot"
independent_oracle = "authored participation, geometry, and hit order declared independently of production indexes"
mutation_control = ["paint index reused for hit", "first candidate selected", "participation omitted", "vector order substituted"]
cleanup_disposition = "dispose the snapshot and return all index, trace, pixel, and lease accounting to zero"
structural_cost = "indexed probes and returned candidates only; no mounted-node scan"
owning_cost_lane = "ExplicitQuery"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_identity"

[[scenario]]
id = "VS-04"
production_claim = "clipping, occlusion, disjoint regions, and half-open edges produce bounded complete-postured point and region evidence"
plausible_defect = "allocation boxes replace paint, clips disappear, right or bottom edges become inclusive, or one receipt is collapsed to one region"
world = "opaque overlap, nested clip, partial offscreen geometry, disjoint regions, and exact boundary points"
semantic_handles = "canonical mechanics, validated realized rows, snapshot-bound points and regions, and receipt traces"
production_entry = "sealed visual snapshot point and region adjudication"
authority_boundary = "runtime projection from canonical mounted truth plus host-realized mechanical geometry"
action_schedule = "query interior, clipped, occluded, boundary, empty, and multi-intersection regions"
typed_expected_outcome = "exact contributors or complete, empty-complete, or truncated region posture; unsupported, stale, expired, transform-unavailable, and affinity-indeterminate conditions remain typed capture outcomes because no queryable receipt exists"
consequential_state = "one mounted receipt may retain multiple regions and one query may return multiple receipts"
independent_oracle = "independently authored canonical boxes, clip lineage, alpha posture, and half-open geometry"
mutation_control = ["allocation box substitution", "clip deletion", "inclusive right-bottom edge", "one box per receipt", "one owner per region"]
cleanup_disposition = "dispose every snapshot and prove mounted publication remains available"
structural_cost = "bounded projection, immutable index structure, query probes, candidates, traces, and leases"
owning_cost_lane = "ExplicitSnapshot and ExplicitQuery"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_identity"

[[scenario]]
id = "VS-05"
production_claim = "selected-surface indexes and snapshot-bound coordinates cannot cross surfaces or snapshots"
plausible_defect = "the runtime falls back to the first surface or accepts a foreign-surface or cross-snapshot point"
world = "two presented surfaces plus two independently sealed snapshots"
semantic_handles = "selected surface target, snapshot identity, coordinate scope, point, region, binding, and presentation epoch"
production_entry = "surface capture followed by point and region adjudication"
authority_boundary = "one exact presentation receipt and its invariant coordinate scope"
action_schedule = "select each surface, query each snapshot, and attempt every cross-surface and cross-snapshot substitution"
typed_expected_outcome = "exact selected-surface evidence; static substitutions fail to compile and dynamic foreign affinity denies"
consequential_state = "no result cites a receipt from another surface, binding, frame, or snapshot"
independent_oracle = "two independently authored surfaces and coordinates"
mutation_control = ["first-surface fallback", "snapshot identity ignored", "binding ignored", "raw coordinate accepted"]
cleanup_disposition = "dispose both snapshots independently with no leaked lease"
structural_cost = "one selected-surface index family per receipt and bounded lookup"
owning_cost_lane = "ExplicitSnapshot and ExplicitQuery"
command = "python scripts/ci/run_worth_ui_compile_contracts.py"

[[scenario]]
id = "VS-08"
production_claim = "snapshot index construction and point or region queries expose bounded structural work while ordinary frames remain cold"
plausible_defect = "queries scan mounted nodes, retain per-pixel identity, hide candidate work, or perform snapshot work on ordinary frames"
world = "deterministic sparse, nested, and maximum-overlap region sets at 1, 1024, and the admitted maximum"
semantic_handles = "visible index, hit index, query budget, cost receipt, and ordinary frame receipt"
production_entry = "runtime index construction and sealed snapshot query methods"
authority_boundary = "immutable frame-scoped indexes built only during explicit snapshot completion"
action_schedule = "build each distribution; run empty, small, maximum-overlap, truncated, and exhausted queries; run ordinary frames without capture"
typed_expected_outcome = "exact structural counters or typed incomplete evidence when the candidate budget is exhausted"
consequential_state = "ordinary counters remain zero and query work never becomes frame work"
independent_oracle = "generator-owned geometry and counter equations rather than elapsed time or production results"
mutation_control = ["full scan", "per-pixel identity buffer", "unbounded candidate walk", "retained memory omitted", "ordinary-lane diagnostic work"]
cleanup_disposition = "drop generated indexes and dispose runtime snapshots with all retained structure accounted"
structural_cost = "declared projection, index-entry, probe, candidate, trace, and retained-byte bounds"
owning_cost_lane = "ExplicitSnapshot and ExplicitQuery"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-runtime visual_snapshot"
