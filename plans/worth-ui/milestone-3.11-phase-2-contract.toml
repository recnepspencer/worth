schema = "worth-ui.milestone-3.11.phase-2-contract.v1"
milestone = "3.11"
phase = 2
status = "closed"
closure_claim = "one admitted visual request pins an exact presentation, crosses an asynchronous host readback fence, returns typed mechanical evidence, and disposes all capture-owned resources"

[authority]
presentation = "mounted presentation receipt binds attempt, frame, semantic surface, host surface, binding, and host-issued epoch"
retention = "mounted retention owns bounded visual snapshot and overlay pin classes"
runtime = "runtime visual inspection owns admission, registered lifecycle, validation, pixels, disposal, and receipt seal"
host = "host contract and egui adapter own mechanical epochs, transforms, screenshot correlation, and byte copying"

[cost_lanes]
ordinary = "zero capture requests, readbacks, snapshot leases, pixel allocations, transforms, and visual receipt work"
snapshot = "indexed frame pin, host request/poll, bounded byte transfer, validation, and receipt seal"

[[batch]]
id = "2A"
claim = "successful presentation carries a retained host-issued epoch and capture crosses an authority-checked asynchronous host port"
gate = "exact, superseded, indeterminate, foreign-affinity, and existing presentation tests"

[[batch]]
id = "2B"
claim = "application policy, concrete grants, retained targets, bounded lease classes, and registered linear capture lifecycle are runtime truth"
gate = "compile twins plus admission, cancellation, deadline, capacity, historical, disposal, and shutdown integration"

[[batch]]
id = "2C"
claim = "egui performs real correlated screenshot-event readback with exact epoch and fractional transform"
gate = "real-adapter exact-epoch, transform, required-pixel, unsupported, disposal, and zero-ordinary-work evidence"

[[scenario]]
id = "VS-02"
production_claim = "a pixel capture remains bound to the exact predecessor presentation across replacement"
plausible_defect = "completion retargets to the current frame or labels an uncopied predecessor as captured"
world = "real runtime and host-contract integration with deterministic schedules plus the production egui adapter"
semantic_handles = "runtime-minted frame, attempt, surface, binding, host epoch, capture request, and pixel artifact"
production_entry = "WorthUiActiveApplicationSession::begin_visual_pixel_snapshot followed by poll_visual_snapshot"
authority_boundary = "runtime-minted request over a retained mounted presentation and host-issued copy epoch"
action_schedule = "queue predecessor bytes before successor publication for the positive twin; advance the epoch before copy for the negative twin"
typed_expected_outcome = "Captured with RetainedPredecessor affinity, Superseded without copied pixels, or CaptureAffinity indeterminate"
consequential_state = "the successor remains current while the completed receipt cites only the predecessor frame and epoch"
independent_oracle = "schedule-owned predecessor/successor bytes and epochs, independent of completion-time current state"
mutation_control = ["current-at-completion retarget", "request-echo-only affinity", "missing epoch fence", "old/new byte relabel"]
cleanup_disposition = "dispose or terminalize every capture and return the snapshot lease and registered resource counts to zero"
structural_cost = "one pinned frame, one in-flight request per surface, one transform, and one bounded pixel payload"
owning_cost_lane = "ExplicitSnapshot"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_snapshot"

[[scenario]]
id = "VS-05"
production_claim = "capture coordinates and surface selection preserve the exact native client area without cross-surface fallback"
plausible_defect = "the runtime assumes zero origin, integer scale, or silently selects the first of multiple surfaces"
world = "two selected surfaces plus a real egui fractional-scale viewport with nonzero client origin"
semantic_handles = "unambiguous current target, host surface binding, viewport identity, coordinate transform, and snapshot receipt"
production_entry = "mounted inspection target derivation followed by real egui screenshot command/event capture"
authority_boundary = "snapshot-bound surface target and host mechanical coordinate observation"
action_schedule = "reject an unselected two-surface receipt, then capture one 160x96 logical viewport at 1.25 scale and native origin 10,15"
typed_expected_outcome = "SurfaceSelectionRequired or Captured with 200x120 physical dimensions, top-left orientation, and pixel-center rounding"
consequential_state = "no request, pixels, or receipt can migrate to another surface or viewport"
independent_oracle = "independently authored origin, scale, orientation, rounding, and selected surface"
mutation_control = ["first-surface fallback", "zero-origin assumption", "integer-scale coercion", "wrong-viewport event"]
cleanup_disposition = "cancel or dispose the exact request; no cross-surface capture remains registered"
structural_cost = "one transform receipt, indexed target selection, and no global surface scan"
owning_cost_lane = "ExplicitSnapshot"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_snapshot"

[[scenario]]
id = "VS-06"
production_claim = "capture handles and visual retention leases are bounded, linear, cancellable, disposable, and fully enumerated at shutdown"
plausible_defect = "a cancelled handle is reused, one surface admits two captures, or leases and pixel bytes survive disposal"
world = "current, retained, expired, pending, cancelled, capacity-exhausted, disposed, and shutdown capture postures"
semantic_handles = "linear pending handle, snapshot and overlay lease classes, registry reservation, disposal receipt, and shutdown report"
production_entry = "begin, poll, cancel, timeout, dispose, and shutdown through the application facade"
authority_boundary = "registered runtime capture state plus mounted snapshot/overlay leases"
action_schedule = "exercise deadline before effects, timeout after effects, cancellation, duplicate admission, independent overlay lease, disposal, and shutdown"
typed_expected_outcome = "DeadlineAlreadyElapsed, TimeoutAfterHostRequest, CapacityExceeded, cancellation receipt, disposal receipt, or shutdown disposition"
consequential_state = "mounted publication remains live after disposal and every visual lease and registered byte count returns to zero"
independent_oracle = "retention budgets, lifecycle state, and host-effect transcript are observed independently"
mutation_control = ["cancelled-handle reuse", "unbounded duplicate capture", "shared snapshot-overlay budget", "shutdown resource leak"]
cleanup_disposition = "all capture registrations, pixel validity, snapshot leases, and overlay leases are released or explicitly reported indeterminate"
structural_cost = "bounded capture count, requested/transferred/retained bytes, one transform, lease count, and retained structure"
owning_cost_lane = "ExplicitSnapshot"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_snapshot"

[[scenario]]
id = "VS-07"
production_claim = "only concrete session-scoped grants and affinity-valid host observations can open capture and receipt sealing"
plausible_defect = "grant types substitute, foreign sessions cause host effects, or malformed transforms and payloads seal receipts"
world = "two sessions, concrete grants, disclosure scopes, expiry, and compatible/incompatible protocol postures"
semantic_handles = "geometry, pixel, and overlay grants; current target; host request; observed affinity; validated capture phase"
production_entry = "public compile facade plus runtime capture admission and the authority-checked host mechanics port"
authority_boundary = "application-declared policy sealed into session-owned non-serializable grants"
action_schedule = "compile every prohibited substitution, submit a foreign-session grant, and inject wrong request, epoch, viewport, region, transform, stride, and capability posture"
typed_expected_outcome = "compile failure, ForeignSession, ProtocolIncompatible, InvalidCoordinateTransform, or CaptureAffinity indeterminate"
consequential_state = "every rejected pre-effect request leaves the adapter transcript empty and every rejected observation yields no receipt"
independent_oracle = "compile-time capability failures plus pre-effect adapter transcript"
mutation_control = ["generic authority marker", "grant aliasing", "unchecked host echo", "malformed payload acceptance"]
cleanup_disposition = "rejected requests allocate no host readback; admitted adversarial requests terminalize and release their pin"
structural_cost = "the existing two compiler sessions plus bounded O(1) affinity and shape checks"
owning_cost_lane = "ExplicitSnapshot"
command = "python scripts/ci/run_worth_ui_compile_contracts.py"
