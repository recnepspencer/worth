schema = "worth-ui.milestone-3.11.phase-1-contract.v1"
milestone = "3.11"
phase = 1
status = "implementation"

[canonical_world]
source = "workspaces/worth-ui/apps/platform-pulse/app/main.wui"
surface = "platform.pulse.surface.main"
background = "platform.pulse.component.seed"
target = "platform.pulse.component.identity_target"
client_extent = [160, 96]
background_point = [16, 16]
target_point = [80, 48]
target_bounds = [48, 24, 64, 48]
target_rgb = [242, 204, 96]

[cost_lanes]
ordinary = "zero snapshot, readback, index, overlay, visual-observation, and visual-retention work without an explicit request"
snapshot = "explicit frame pin, host capture, transfer, region projection, index construction, trace projection, and receipt seal"
query = "bounded lookup against one sealed immutable snapshot index"
overlay = "bounded diagnostic projection, successor publication, and managed disposal"
executable_world = "external native capture, cross-process correlation, failure artifacts, and teardown"

[[scenario]]
id = "VS-01"
phase_1_claim = "the exact checked-in product page produces distinct background and target allocation, mounted-receipt, paint, and external-pixel consequences"
production_claim = "the exact checked-in product page produces distinct background and target allocation, mounted-receipt, paint, and external-pixel consequences"
plausible_defect = "a sole-node or collapsed-neighborhood page can pass lifecycle tests while never producing an independently reachable target pixel"
world = "the checked-in 160x96 pulse page with a viewport background and 48x24 inset identity target"
semantic_handles = "platform.pulse.component.seed; platform.pulse.component.identity_target; [16,16] background; [80,48] target"
production_entry = "WorthUiFilesystemSourceProvider through the canonical native shell and sole platform-pulse executable"
authority_boundary = "production filesystem lowering, mounted publication receipts, egui host mechanics, and external native client capture"
action_schedule = "mount and publish blue; observe both points; replace green; reject malformed; recover blue; close normally"
typed_expected_outcome = "two distinct committed mounted receipts and two exact filled rectangles whose target remains yellow through background replacement"
consequential_state = "replacement advances the background generation while malformed input preserves the published predecessor and recovery republishes blue"
independent_oracle = "authored target name, fixed client points, fixed target bounds/RGB, and external client pixels are owned outside runtime adjudication"
mutation_control = ["sole-node", "collapsed-neighborhood", "event-only", "pixel-only", "wrong-target", "premature-exit", "residue"]
cleanup_disposition = "normal child exit, closed observation stream, released native binding, and removed isolated source workspace"
structural_cost = "one child/window, zero retries, at most 8 native captures, 256 protocol observations, 1 MiB protocol bytes, and 30 seconds"
owning_cost_lane = "executable_world"
lane = "existing application_contracts target plus sole executable_world target"
fixture = "checked-in background-plus-inset-target pulse"
oracle = "authored target name and independent [16,16]/[80,48] client points"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts platform_pulse"

[[scenario]]
id = "VS-09"
phase_1_claim = "target construction, grant separation, artifact access, and coordinate scope are compiler-visible"
production_claim = "public target construction, grant separation, artifact access, coordinate scope, and pending-handle linearity are compiler-visible"
plausible_defect = "runtime checks or private conventions can allow wrong grants, raw targets, pixel access, escaped coordinates, or reuse of a consumed capture"
world = "the existing two-session worth-ui compile-contract fixture against the production facade"
semantic_handles = "UiCurrentPresentedSurfaceTarget; UiVisualGeometryGrant; UiVisualPixelCaptureGrant; UiVisualSnapshotReceipt; UiPendingVisualCapture"
production_entry = "WorthUiNativeApplicationShell visual snapshot facade"
authority_boundary = "session-minted concrete grants, sealed targets/policies, generative coordinate scope, and consuming pending handles"
action_schedule = "compile the consolidated valid lifecycle, then compile five invalid programs in the same compiler session"
typed_expected_outcome = "valid governed use compiles; each invalid twin fails at its intended type, visibility, capability, lifetime, or move boundary"
consequential_state = "no invalid program can obtain a runtime capture effect or reuse a consumed handle"
independent_oracle = "the Rust type checker evaluates product-facing source twins; expected categories omit incidental compiler prose"
mutation_control = ["wrong-grant", "geometry-pixels", "raw-target", "coordinate-escape", "cancelled-reuse"]
cleanup_disposition = "compile fixture produces no runtime resources; generated diagnostics remain bounded checked-in evidence"
structural_cost = "one existing product compiler session plus the existing certification session; no new integration crate"
owning_cost_lane = "compile_contract"
lane = "existing two-session compile-contract owner"
fixture = "governed visual snapshot pass twin and five invalid twins"
oracle = "canonical compiler diagnostic category per invalid source"
command = "python scripts/ci/run_worth_ui_compile_contracts.py"

[[module_home]]
owner = "host mechanics"
path = "workspaces/worth-ui/crates/worth-ui-host-contract/src/visual_snapshot/mod.rs"

