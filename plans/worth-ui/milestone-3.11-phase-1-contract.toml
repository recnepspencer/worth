path = "workspaces/worth-ui/crates/worth-ui-runtime/src/inspection/visual_snapshot/mod.rs"

[[module_home]]
owner = "egui mechanics"
path = "workspaces/worth-ui/crates/worth-ui-host-egui/src/adapter/visual_snapshot/mod.rs"

[[module_home]]
