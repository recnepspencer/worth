schema = "worth-ui.milestone-3.11.phase-5-contract.v1"
milestone = "3.11"
phase = 5
status = "closed"
closure_claim = "visual identity is bounded, explicitly disclosed, immutably evidenced, publicly documented, and handed to 3.12 without redesign"

[authority]
policy = "application construction seals disclosure, region, byte, query, snapshot, and overlay bounds into one session authority"
snapshot = "the live runtime receipt owns leases and exposes one immutable non-authoritative UiVisualSnapshotEvidence projection"
host = "the host returns presentation-bound mechanics and never decides disclosure, redaction, semantic identity, or retention"
docs = "public examples are exact copies of existing compile-pass sources and are run through existing production-path witnesses"
ledger = "the Phase 5 audit requires exactly one proved VS-01 through VS-09 row set"

[[batch]]
id = "5A"
status = "closed"
claim = "snapshot evidence, disclosure matching, and redaction are explicit typed production contracts"
gate = "compile twins plus disclosure/redaction application and topology contracts"
evidence = "33 visual snapshot contracts; 17 visual identity contracts; 4 Phase 5 contract/ledger audits; 35 fail and 13 pass compile targets in 2 Cargo sessions; affected all-target/all-feature clippy -D warnings; scoped WORTH UI line cap; boundary-check; agent-context check; git diff --check"

[[batch]]
id = "5B"
status = "closed"
claim = "record, structure, query, pixel, snapshot, overlay, executable, and unchanged-frame costs are admitted, measured, and disposed"
gate = "focused structural cost tests plus consolidated application and executable-world evidence"
evidence = "9 executable-world tests with the WGPU product renderer, exact-HWND WGC pixels, 6 captures, and zero retries; 56 consolidated visual application contracts; 7 exact spatial cost contracts at 1, 1024, and 65536 records; repeated unchanged ordinary frames at [0; 11]; 5 Phase 5 contract/ledger audits; 35 fail and 13 pass compile targets in 2 Cargo sessions; affected all-target/all-feature clippy -D warnings; 357 dirty/new WORTH UI Rust files under the 400-line cap; dirty-function scrutiny; cargo fmt --check; boundary-check; agent-context check; git diff --check"

[[batch]]
id = "5C"
status = "closed"
claim = "the public visual workflow and permanent human pulse are documented against exact executable witnesses"
gate = "documentation topology audit, compile matrix, application witness, and human command inventory"
evidence = "7 Phase 5 documentation, contract, ledger, and mutation audits; byte-exact full compile source plus a source-contained small example; 35 fail and 13 pass compile targets in 2 Cargo sessions; 4 focused Platform Pulse application tests; task-first feature documentation QA; certification all-target/all-feature clippy -D warnings; 335-line parent and 178-line child topology files; dirty-function scrutiny; cargo fmt --check; boundary-check; agent-context check; git diff --check"

[[batch]]
id = "5D"
status = "closed"
claim = "all nine scenario contracts, milestone gates, and the 3.12 handoff close on exact final source"
gate = "closed ledger audit, roadmap audit, QA disciplines, and constitutional commands"
evidence = "VS-01 through VS-09 are exactly ordered and PROVED with contract-owned commands; 11 executable-world tests; 35 visual snapshot, 21 visual identity, 7 spatial, and 56 consolidated visual contracts; 35 fail and 13 pass compile targets in exactly 2 Cargo sessions; 1 exact cross-lane cold-frame contract; 134 topology contracts and 15 product-contract mutations; full workspace all-feature tests including 858 runtime tests; full workspace all-target/all-feature clippy -D warnings; 32 test-topology meta-tests; canonical and 357-file dirty/new Rust line caps; dirty-function and test-honesty review; cargo fmt --check; git diff --check; boundary-check; agent-context check"

