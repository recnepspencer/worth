schema = "worth-ui.milestone-3.13.phase-1-contract.v1"
milestone = "3.13"
phase = 1
status = "closed"
closure_claim = "the projection grammar, real upstream producer reachability, budgets, ownership boundary, exact open milestone rows, existing-target evidence homes, and compile-time anti-bypass contracts are frozen without claiming later production behavior"
ledger = "plans/worth-ui/milestone-3.13-proof-ledger.csv"

[public_contract]
binding_posture = ["UiScalarProjectionBindingAdmission", "UiCollectionProjectionBindingAdmission", "UiProjectionBindingStopReceipt"]
fact_posture = ["UiProjectionAvailability", "UiPresentProjection", "UiProjectionUnavailableReceipt", "UiProjectionFactStopReceipt"]
shape_specific_bindings = ["UiScalarProjectionBinding", "UiCollectionProjectionBinding"]
shape_specific_facts = ["UiScalarProjectionFactReceipt", "UiCollectionProjectionFactReceipt"]
private_construction = true
affine_governed_receipts = true
raw_query_returned = false

[declaration]
scalar = "one contract-derived selected field, native family, and lifecycle requirement"
collection = "contract-derived row identity, selected fields, native family, lifecycle, completeness, and continuation"
field_identity = "validated declared source field identity; no label, column index, or renderer string"

[budget]
profile = "worth-ui.platform-pulse.query-consumption.v1"
bindings_admitted = 1
scalar_fields_accessed = 1
collection_rows = 0
collection_change_operations = 0
continuation_operations = 0
native_bytes_retained = 65536
diagnostic_summary_bytes = 4096
rich_diagnostic_bytes = 262144
supporting_scenarios_are_explicitly_bounded = true

[producer_reachability]
bridge_transition_type = "BridgeMixedCauseAsyncResultTransition"
query_binding_type = "WorthQueryAsyncSourceBinding"
query_transition_type = "WorthQueryAsyncSourceTransition"
pending_current_command = "cargo test --manifest-path workspaces/worth-query/Cargo.toml -p worth-query runtime::tests::live_state::async_source_binding --lib"
stale_revalidating_current_command = "cargo test -p worth-runtime-bridge facade::tests::subscription::mixed_cause --lib"
synthetic_wui_status_producer = false

[ownership]
raw_query_owner = "worth-ui-query-binding"
runtime_audience = "worth-ui-runtime facade query_binding"
product_audience = "worth-ui facade query_binding"
host_consumes_query = false
runtime_imports_raw_query = false
pulse_imports_raw_query = false

[evidence_topology]
new_test_target = false
new_compile_island = false
compile_owner = "scripts/ci/run_worth_ui_compile_contracts.py"
topology_target = "worth-ui-certification topology_contracts"
application_target = "worth-ui-certification application_contracts"
declaration_target = "worth-ui-certification declaration_contracts"
product_target = "worth-ui-platform-pulse executable_world"

[[proof_row]]
id = "QP-01"
closure_phase = 4
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --features executable-world --test executable_world courtroom::platform_pulse_lifecycle::canonical_platform_pulse_survives_blue_green_denial_recovery_and_normal_shutdown -- --exact --nocapture"

[[proof_row]]
id = "QP-02"
closure_phase = 2
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts projection_lifecycle::qp_02 -- --nocapture"

[[proof_row]]
id = "QP-03"
closure_phase = 2
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts projection_compatibility::qp_03 -- --nocapture"

[[proof_row]]
