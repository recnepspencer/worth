schema = "worth-ui.milestone-3.11.phase-4-contract.v1"
milestone = "3.11"
phase = 4
status = "closed"
closure_claim = "one retained snapshot can derive a governed identity overlay that becomes a distinct mounted successor, is externally visible in the permanent platform pulse, and clears through an equally explicit successor"

[authority]
snapshot = "the live runtime-owned snapshot receipt alone binds selected receipt identity, target geometry, frame, surface, binding, and retained base authority"
overlay = "the active application session alone acquires overlay retention, registers linear overlay state, and stages publish or clear"
mounted = "mounted assembly owns successor frame identity and the host-neutral diagnostic border projection"
host = "the adapter translates the mounted border mechanic and reports presentation consequence without identity meaning"
pulse = "ordinary product composition owns one bounded one-shot snapshot, trace, overlay, and clear exercise"
runner = "the executable runner joins derived product events to independent process-bound native pixels without constructing runtime authority"

[cost_lanes]
ordinary = "zero visual work except the platform pulse's one deliberate bounded one-shot exercise"
snapshot = "one admitted capture of the fixed 160-by-96 logical page, a declared maximum 4x physical scale and 983040-byte ceiling, and bounded point adjudication"
overlay = "one four-strip border projection, one published successor, one cleared successor, and bounded managed retention"
executable = "one child and window, at most eight native captures, at most 256 events, at most one MiB encoded observations, and at most thirty seconds"

[[batch]]
id = "4A"
claim = "snapshot-bound selection mints a non-forgeable overlay target and the active session owns linear pending, published, clearing, cleared, cancellation, and shutdown disposition"
gate = "compile twins plus consolidated retention and lifecycle application contracts"

[[batch]]
id = "4B"
claim = "overlay state participates in exact mounted reuse, produces a distinct successor diagnostic projection, and the egui adapter translates only that receipted mechanic"
gate = "mounted projection, host translation, publication, supersession, clear, and mutation-control tests"

[[batch]]
id = "4C"
claim = "protocol v2 and the permanent one-shot pulse expose snapshot, trace, overlay-published, and overlay-cleared evidence in the same cumulative native child"
gate = "protocol tests plus the sole Windows executable-world journey and external pixel adjudication"

[[scenario]]
id = "VS-01"
production_claim = "the exact product process captures its first mounted frame, resolves independent target and background points, traces the target, publishes and clears a mounted overlay, and then completes replacement, malformed preservation, recovery, close, and cleanup in one child"
plausible_defect = "the product emits events without visible consequence, pixels appear without mounted identity, every point resolves to one node, or a separate test-only process performs inspection"
world = "the checked-in nondegenerate 160-by-96 logical platform pulse in an isolated source sandbox, one Cargo-built binary, one process-bound Windows client area explicitly raised through a compositor barrier before each external monitor capture, and independently fixed logical target and background points projected through the sealed capture transform"
semantic_handles = "published frame, snapshot, visible result, hit result, mounted trace, overlay target, published overlay, cleared overlay, replacement generations, and shutdown receipt"
production_entry = "ordinary main through eframe, PlatformPulseNativeFrame, WorthUiNativeApplicationShell, and WorthUiHostEgui"
authority_boundary = "product receipts carry runtime meaning; host observations carry presentation affinity; external captures carry native consequence"
action_schedule = "launch, first frame, snapshot, target and background adjudication, trace, overlay successor, explicit native exposure, external capture, clear successor, explicit native exposure, restored capture, replacement, malformed preservation, recovery, native close, exit, and residue audit"
typed_expected_outcome = "target paint and hit independently resolve to the authored target, background does not, overlay and clear cite distinct exact frames, and inherited lifecycle truth remains causal"
consequential_state = "the target border appears only after overlay publication, disappears only after clear publication, and no visual resource survives shutdown"
independent_oracle = "checked-in authored target name, logical page geometry, logical points, and physical-scale ceiling plus external target, control, border, and restored pixel predicates"
mutation_control = ["event-only success", "pixel-only success", "sole-node fallback", "direct egui overlay", "wrong target", "skipped platform", "premature exit", "retained residue"]
cleanup_disposition = "normal close reports every capture and overlay disposition, successful process exit, released surface, stopped watcher, and deleted sandbox"
structural_cost = "one child, zero retries, at most eight native captures, bounded observations, and explicit per-transition deadlines"
owning_cost_lane = "ExplicitSnapshot, ExplicitOverlay, and ExecutableWorld"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --features executable-world --test executable_world"

[[scenario]]
id = "VS-06"
production_claim = "overlay work owns a subordinate base-snapshot lease and linear managed lifecycle whose publication and clear complete only through distinct presented successors"
plausible_defect = "dropping the parent invalidates pending work, dropping a published handle silently clears native state, clear is claimed before presentation, or shutdown leaks a published overlay"
world = "current and retained predecessor snapshots, pending and published overlays, superseded targets, explicit clear, cancellation, and shutdown"
semantic_handles = "snapshot identity, overlay grant, opaque target, pending overlay, published overlay, clearing overlay, clear receipt, base frame, published frame, cleared frame, and shutdown disposition"
production_entry = "WorthUiActiveApplicationSession and WorthUiNativeApplicationShell managed overlay facade"
authority_boundary = "runtime session registry plus mounted VisualOverlay lease and exact retained snapshot basis"
action_schedule = "derive target, drop parent, publish, attempt foreign and superseded targets, stage clear, present clear successor, cancel pre-effect work, and shut down in each posture"
typed_expected_outcome = "subordinate work survives parent drop, invalid targets deny exactly, publication and clear cite their successor frames, and shutdown enumerates remaining work"
consequential_state = "published overlays persist until a successful clear successor or shutdown disposition; pending cancellation has no native effect"
independent_oracle = "retention class accounting, mounted publication identities, host projection observations, and shutdown report"
mutation_control = ["parent-drop invalidation", "drop-as-clear", "same-frame publication", "same-frame clear", "unbounded overlays", "shutdown leak"]
cleanup_disposition = "all overlay registrations and typed retention leases are released or explicitly reported disposed by shutdown"
structural_cost = "bounded overlay count, one retained structural lease per active overlay, four border strips, and constant registry lookup"
owning_cost_lane = "ExplicitOverlay"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_identity::"

[[scenario]]
id = "VS-07"
production_claim = "the public facade exposes governed snapshot, adjudication, trace, overlay, and clear workflows while protocol v2 carries only derived non-authoritative correlation values"
plausible_defect = "raw wire identities construct runtime targets, the runner imports runtime internals, overlay publication lacks a grant, or the pulse hides behavior behind cfg(test)"
world = "downstream compile twins, protocol v1 incompatibility, protocol v2 round trips, production pulse source, and runner dependency topology"
semantic_handles = "concrete grants, invariant snapshot coordinates, opaque overlay targets, linear overlay handles, versioned wire identities, run identity, and sequence"
production_entry = "worth_ui::facade inspection and app exports plus worth_ui_platform_pulse::observation_contract"
authority_boundary = "public runtime authority stays unconstructible; wire projections are output-only and rejected before adjudication when incompatible"
action_schedule = "compile the valid facade journey, reject invalid grant and raw target substitutions, decode v2 observations, reject v1, and audit product and runner dependencies"
typed_expected_outcome = "only the governed public sequence compiles; incompatible protocol denies before use; wire values have no runtime constructor path"
consequential_state = "no invalid compile case, wire payload, runner module, or test configuration can publish an overlay"
independent_oracle = "compiler diagnostics, manifest topology, source scan, and protocol fixtures authored independently of runtime execution"
mutation_control = ["raw identity constructor", "wire re-entry", "missing overlay grant", "test-only pulse", "runner runtime import", "protocol downgrade"]
cleanup_disposition = "compile fixtures and protocol tests own no runtime resources; product shutdown closes all live resources"
structural_cost = "existing two compile sessions, bounded v2 event size, no screenshot bytes on stdout, and no new executable target"
owning_cost_lane = "CompileContract and ExecutableWorld"
command = "python scripts/ci/run_worth_ui_compile_contracts.py"
