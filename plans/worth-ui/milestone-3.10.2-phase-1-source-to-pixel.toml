schema = "worth-ui.milestone-3.10.2.phase-1-source-to-pixel.v1"
milestone = "3.10.2"
phase = 1
status = "closed"

[scenario]
identity = "worth-ui.platform-pulse.seed"
package = "worth-ui-platform-pulse"
source_path = "workspaces/worth-ui/apps/platform-pulse/app/main.wui"
source_module = "app/main.wui"
initial_source = """component platform.pulse.component.seed {}
surface platform.pulse.surface.main {}
token theme.platform_pulse.fill = "theme.platform_pulse.blue";
"""
valid_edit_from = 'theme.platform_pulse.blue'
valid_edit_to = 'theme.platform_pulse.green'
malformed_edit = 'token theme.platform_pulse.fill = "theme.platform_pulse.green'
initial_rgba = [47, 129, 247, 255]
successor_rgba = [63, 185, 80, 255]
canonical_x = 0
canonical_y = 0
canonical_width = 160
canonical_height = 96
layer_semantic_order = 0
clip_posture = "exact-canonical-box"
replacement_classification = "whole-application-replacement"

[composition_root]
owner = "worth-ui-platform-pulse"
rationale = "The application chooses the canonical source root, capability registrations, production watcher, host adapter, native shell, and shutdown order; those are downstream product-composition decisions rather than reusable facade or adapter meaning."
facade_exclusion = "worth-ui aggregates an audience contract and may orchestrate sealed lifecycle authority, but it must not choose the pulse source, window, event loop, or scenario."
adapter_exclusion = "worth-ui-host-egui translates complete host-contract mechanics and must not own source acquisition, capability admission, runtime mounting, replacement, or application identity."

[native_shell]
package = "eframe"
version_requirement = "=0.35.0"
uses_default_features = false
features = ["default_fonts", "wgpu_no_default_features"]
adjudication = "Milestone 3.14 Phase 1 narrows the courtroom to the workspace egui 0.35 family and the qualified WGPU renderer without enabling unqualified renderer or window-system backends."

[static_paint]
primitive = "filled-rectangle"
runtime_owner = "worth-ui-runtime mounting projection"
host_contract_owner = "worth-ui-host-contract mounted projection"
native_mechanic_owner = "worth-ui-host-egui"
required_join = [
  "exact-mounted-node-receipt",
  "committed-allocation-box",
  "admitted-file-authored-color",
  "explicit-layer",
  "explicit-clip",
  "surface-binding-generation",
  "mounted-frame-identity",
]
forbidden_early_scope = [
  "appearance-roles",
  "component-defaults",
  "interaction-state-styling",
  "theme-switching",
  "theme-invalidation",
  "typography",
  "borders-radii-shadows",
  "renderer-fallbacks",
]

[[edge]]
id = "E01_CHECKED_SOURCE_TO_FILESYSTEM_PROVIDER"
producer = "canonical checked-in app/main.wui bytes"
consumer = "WorthUiFilesystemSourceProvider"
cardinality = "one canonical root, one source module"
lifetime = "process root plus immutable acquired snapshot"
authority_owner = "filesystem source provider"
failure_owner = "filesystem acquisition denial"
effect_owner = "none"
cost_class = "initial and watcher-settlement filesystem I/O"
forbidden_shortcut = "in-memory registration, handcrafted package, or test fixture source"

[[edge]]
id = "E02_PROVIDER_TO_SETTLED_SNAPSHOT"
producer = "WorthUiFilesystemSourceWatcher"
consumer = "WorthUiSettledSourceSnapshot"
cardinality = "one initial snapshot or one settled replacement snapshot"
lifetime = "move-only settlement handoff"
authority_owner = "runtime source ingress"
failure_owner = "filesystem watcher denial"
effect_owner = "operating-system watcher"
cost_class = "bounded event settlement"
forbidden_shortcut = "fake watcher event or direct provider injection"

[[edge]]
id = "E03_SNAPSHOT_TO_SEALED_AUTHORED_MEANING"
producer = "WorthUiSettledSourceSnapshot plus frozen CapabilitySnapshot"
consumer = "WorthUiDslCompiler sealed semantic package"
cardinality = "one snapshot to one admitted candidate submission"
lifetime = "candidate preparation"
authority_owner = "DSL for authored meaning; runtime for capability admission"
failure_owner = "DSL compilation or runtime semantic-handoff denial"
effect_owner = "none"
cost_class = "replacement-only parsing and semantic preparation"
forbidden_shortcut = "runtime parser, app-authored AST, or adapter token lookup"

[[edge]]
id = "E04_SEALED_MEANING_TO_PREPARED_GENERATION"
producer = "WorthUiWatchedCandidateSubmission"
consumer = "WorthUi prepared application authority"
cardinality = "one consumed submission to one generation or typed denial"
lifetime = "prepared and active application generation"
authority_owner = "worth-ui-runtime application lifecycle"
failure_owner = "application preparation denial"
effect_owner = "none"
cost_class = "initial preparation or whole-application replacement"
forbidden_shortcut = "split candidate fields or app-minted generation identity"

[[edge]]
id = "E05_GENERATION_TO_GRAPH_NODE"
producer = "prepared declaration and graph authority"
consumer = "runtime graph node selected for the pulse surface"
cardinality = "one declared pulse component to one mounted graph node"
lifetime = "active generation"
authority_owner = "worth-ui-runtime graph"
failure_owner = "graph preparation or mounted identity denial"
effect_owner = "none"
cost_class = "generation preparation plus affected-node width"
forbidden_shortcut = "component name inferred in the app or adapter"

[[edge]]
id = "E06_GRAPH_NODE_TO_MOUNTED_RECEIPT"
producer = "runtime graph node and semantic surface"
consumer = "exact mounted instance and node receipt"
cardinality = "one pulse node instance on one bound surface"
lifetime = "mounted generation and frame epoch"
authority_owner = "worth-ui-runtime mounted identity"
failure_owner = "mounted identity denial"
effect_owner = "none"
cost_class = "mounted instance width"
forbidden_shortcut = "app-minted receipt, row index identity, or count-only proxy"

[[edge]]
id = "E07_LAYOUT_TO_COMMITTED_ALLOCATION"
producer = "runtime allocation planning and host viewport measurement"
consumer = "committed canonical allocation box"
cardinality = "one admitted box per mounted pulse instance"
lifetime = "allocation truth revision"
authority_owner = "worth-ui-runtime allocation"
failure_owner = "allocation establishment denial"
effect_owner = "none"
cost_class = "affected allocation neighborhood"
forbidden_shortcut = "adapter-chosen rectangle or app-authored mounted box"

[[edge]]
id = "E08_AUTHORED_TOKEN_TO_ADMITTED_COLOR"
producer = "file-authored theme.platform_pulse.fill token reference"
consumer = "resolved opaque RGBA carried by runtime mounting"
cardinality = "one authored reference to one registered color value"
lifetime = "prepared generation"
authority_owner = "DSL authored reference plus runtime capability registry"
failure_owner = "unresolved, wrong-family, or invalid-color admission denial"
effect_owner = "none"
cost_class = "preparation-time indexed token resolution"
forbidden_shortcut = "adapter fallback, string lookup on steady frames, or app-selected color"

[[edge]]
id = "E09_AUTHORITIES_TO_COMPLETE_PAINT"
producer = "mounted receipt, allocation, admitted color, layer, clip, binding, and frame"
consumer = "complete host-contract filled-rectangle row"
cardinality = "one complete primitive per admitted pulse node"
lifetime = "mounted frame projection and retained delta"
authority_owner = "worth-ui-runtime mounting projection"
failure_owner = "mounted projection denial"
effect_owner = "none before host admission"
cost_class = "admitted node and primitive width"
forbidden_shortcut = "drawable count-only paint or optional effect-boundary fields"

[[edge]]
id = "E10_COMPLETE_PAINT_TO_HOST_ADMISSION"
producer = "sealed complete filled-rectangle row"
consumer = "WorthUiHostEgui preflight"
cardinality = "one row validated once before translation"
lifetime = "one presentation attempt"
authority_owner = "host-contract validation"
failure_owner = "host presentation admission rejection"
effect_owner = "none before complete validation"
cost_class = "translated row and byte width"
forbidden_shortcut = "partial translation followed by validation"

[[edge]]
id = "E11_HOST_ADMISSION_TO_EGUI_SHAPE"
producer = "admitted canonical rectangle and RGBA"
consumer = "egui clipped filled-rectangle shape"
cardinality = "one complete primitive to one native shape"
lifetime = "native frame"
authority_owner = "host contract; adapter owns only mechanical conversion"
failure_owner = "egui native translation denial"
effect_owner = "worth-ui-host-egui NativePaint"
cost_class = "exact translated rows, bytes, shapes, and cache observations"
forbidden_shortcut = "direct app painter call or renderer-chosen geometry/color"

[[edge]]
id = "E12_EGUI_SHAPE_TO_VISIBLE_PIXEL"
producer = "egui native shape bound to the presented frame"
consumer = "native shell framebuffer"
cardinality = "one native shape to its rasterized covered pixels"
lifetime = "presented native frame"
authority_owner = "native shell presentation mechanics"
failure_owner = "native shell launch or presentation failure"
effect_owner = "native event loop and renderer"
cost_class = "native link, launch, frame, and raster cost"
forbidden_shortcut = "unrelated screenshot associated after publication"

[[edge]]
id = "E13_VALID_EDIT_TO_SUCCESSOR_PUBLICATION"
producer = "settled real filesystem color-token edit"
consumer = "atomically published successor application and mounted frame"
cardinality = "one settled valid edit to one successor or typed denial"
lifetime = "replacement transaction"
authority_owner = "worth-ui-runtime whole-application replacement"
failure_owner = "replacement preparation, admission, presentation, or publication denial"
effect_owner = "native paint only after successor preflight"
cost_class = "replacement transaction plus affected paint completion"
forbidden_shortcut = "claiming 3.12 hot rebind or changing pixels before publication"

[[edge]]
id = "E14_MALFORMED_EDIT_TO_PREDECESSOR_PRESERVATION"
producer = "settled malformed filesystem edit"
consumer = "typed DSL denial and unchanged active generation"
cardinality = "one malformed edit to one denial with zero successor effects"
lifetime = "failed replacement attempt"
authority_owner = "DSL diagnostics and runtime predecessor"
failure_owner = "DSL compilation denial"
effect_owner = "none"
cost_class = "failed parse and diagnostic width"
forbidden_shortcut = "partial successor activation, blank frame, or silent fallback"

[[rejection]]
id = "R01_MISSING_ALLOCATION"
condition = "complete primitive has no committed allocation"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R02_UNRESOLVED_OR_INVALID_COLOR"
condition = "authored reference is absent, wrong-family, cyclic, or not a valid color"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R03_OMITTED_LAYER"
condition = "paint row has no explicit admitted layer"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R04_OMITTED_OR_FOREIGN_CLIP"
condition = "clip is omitted or not admitted for the primitive layer"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R05_STALE_NODE_RECEIPT"
condition = "node receipt does not belong to the current mounted instance/frame basis"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R06_FOREIGN_SURFACE_BINDING"
condition = "surface binding generation is foreign or stale"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R07_UNSUPPORTED_PROTOCOL"
condition = "host protocol does not admit the complete primitive version"
required_result = "reject before effects and preserve predecessor"

[[rejection]]
id = "R08_MISSING_NATIVE_PAINT_CAPABILITY"
condition = "host capability profile does not admit NativePaint"
required_result = "reject before effects and preserve predecessor"

[[mutation]]
id = "M01_DIRECT_EGUI_DRAWING"
fault = "draw the expected rectangle from the application with egui Painter"
detection = "native shape lacks the exact mounted frame, node receipt, allocation, binding, and host-effect evidence chain"
invalidated_evidence = ["mounted-frame-identity", "mounted-node-receipt", "committed-allocation", "surface-binding", "native-paint-effect"]

[[mutation]]
id = "M02_INJECTED_SOURCE"
fault = "submit equivalent source through an in-memory provider or fake watcher event"
detection = "provider kind, watcher readiness, settled snapshot, filesystem revision, and shutdown evidence no longer match"
invalidated_evidence = ["filesystem-provider-kind", "watcher-readiness", "settled-snapshot", "filesystem-revision", "watcher-shutdown"]

[[mutation]]
id = "M03_COUNT_ONLY_PAINT"
fault = "treat UiMountedPaintBatchRow primitive_count as drawable geometry"
detection = "no complete primitive exists, so NativePaint admission must reject and shape count remains zero"
invalidated_evidence = ["complete-paint-primitive", "native-paint-admission", "native-shape"]

[[mutation]]
id = "M04_DETACHED_SCREENSHOT"
fault = "attach an unrelated matching-color screenshot after the mounted frame"
detection = "image evidence has no matching generation, mounted frame, binding, node receipt, publication, or native-shape handle"
invalidated_evidence = ["application-generation", "mounted-frame-identity", "surface-binding", "mounted-node-receipt", "publication-receipt", "native-shape"]

[[public_gap]]
id = "G01_INITIAL_SOURCE_CAPABILITY_FREEZE"
current_constraint = "WorthUiSettledSourceSnapshot lowering needs CapabilitySnapshot before WorthUiApplicationBuilder::freeze produces it"
required_contract = "a narrow public application-shell preparation path consumes the builder and settled snapshot atomically without exposing capability authority"

[[public_gap]]
id = "G02_ORDINARY_MOUNT_AND_ALLOCATION"
current_constraint = "surface creation, mounting, and allocation establishment are exposed through certification extension traits"
required_contract = "a narrow public application-shell lifecycle owns ordinary root-surface mount, allocation, frame, replacement, and shutdown orchestration"

[[oracle]]
id = "O01_AUTHORED_EXPECTATION"
independent_observation = "literal frozen source bytes and RGBA values in this ledger"

[[oracle]]
id = "O02_HEADLESS_TRANSCRIPT"
independent_observation = "canonical box, RGBA, identities, and intentionally-unperformed NativePaint effect"

[[oracle]]
id = "O03_NATIVE_SHAPE"
independent_observation = "egui clipped-shape geometry and Color32 inspected independently of runtime paint construction"

[[oracle]]
id = "O04_PUBLICATION"
independent_observation = "active generation and publication receipt change only after the complete successor frame presents"
