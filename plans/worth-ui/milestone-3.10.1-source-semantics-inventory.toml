schema = "worth-ui.milestone-3.10.1.source-semantics.v1"
milestone = "3.10.1"
phase = 2
canonical_progression = [
  "authored source",
  "tokenization",
  "parse tree",
  "authored legality",
  "normalized semantic artifact",
  "sealed DSL package",
  "runtime candidate admission",
  "prepared application",
  "mounted application",
  "active application",
  "frame execution",
  "inspection projection",
]
forbidden_parallel_progressions = [
  "runtime-owned parser or parse tree",
  "caller-assembled package accepted as sealed semantic proof",
  "filesystem observation deciding authored legality",
  "Rust-authored input bypassing the same normalized semantic artifact",
]

[[scope]]
id = "dsl"
root = "crates/worth-ui-dsl/src"
exclude = ["tests"]
expected_files = 89
path_set_fingerprint = "ca26bc08d4f54ccc"
# Milestone 3.13 adds one DSL-owned authored projection-requirement schema
# shared by file and Rust authoring. Milestone 3.14 adds typed intent meaning
# under the existing semantic/compiler owners; neither creates runtime language
# authority.
content_fingerprint = "97eaec5e10edca13"

[[scope]]
id = "runtime-source"
root = "crates/worth-ui-runtime/src/source"
exclude = ["tests", "test_compilation.rs"]
expected_files = 110
path_set_fingerprint = "9583dfaa351f4519"
# Milestone 3.11 adds explicit static-paint meaning beside allocation geometry;
# both participate in source equivalence without creating a parallel lane.
# Milestone 3.12 adds the typed bounded-comparison denial beside exhaustive
# artifact equivalence; comparison remains in the existing semantic-identity owner.
# Milestones 3.13-3.14 extend the existing runtime admission artifacts with
# typed projection and intent dependencies without reopening authored source.
content_fingerprint = "3a0cc84ef3968f6d"

[[scope]]
id = "runtime-source-ingress"
root = "crates/worth-ui-runtime/src/runtime/source_ingress"
expected_files = 35
path_set_fingerprint = "c5b45bb3db29679a"
# Milestone 3.11 carries ViewportInset's two authored axes through the semantic
# handoff beside FillViewport without creating a parallel ingress lane.
# Milestone 3.12 retains exact watched/Rust origin beside candidate composition
# in one typed authored-source basis under the existing runtime-candidate owner.
# Milestones 3.13-3.14 carry projection and authored-intent material through the
# sealed handoff while declaration interpretation remains in declaration owners.
content_fingerprint = "cc0e11330672f1c2"

[[scope]]
id = "runtime-replacement"
root = "crates/worth-ui-runtime/src/runtime/replacement"
exclude = ["tests"]
expected_files = 149
path_set_fingerprint = "20258d5938a737fa"
# Milestone 3.12 extends the existing replacement owners with bounded exhaustive
# comparison and typed precomputed planning handoff; no parallel replacement lane.
content_fingerprint = "74434aca31af5143"

# Every production Rust file in the three scopes must match exactly one row.
# `directory` includes its mod.rs; `direct-children` excludes nested directories.

[[classification]]
id = "dsl-root"
scope = "dsl"
match = "exact"
path = "lib.rs"
current_owner = "worth-ui-dsl"
responsibility = "crate boundary for pure authored meaning"
capabilities = ["semantic-facade"]
authority_in = ["authored semantic values"]
authority_out = ["DSL-owned semantic types"]
lifecycle = "authored meaning"
failure_owner = "DSL"
cost = "ordinary construction"
destination = "worth-ui-dsl"
disposition = "retain"
forbidden_shortcut = "re-export runtime-owned parser or admission authority"

