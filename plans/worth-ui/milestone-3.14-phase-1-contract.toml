schema = "worth-ui.milestone-3.14.phase-1-contract.v1"
milestone = "3.14"
phase = 1
status = "closed"
closure_claim = "the intent definition/declaration/route split, typed destination and outcome topology, operability axes, native producer reachability, Query/domain non-authority, budgets, evidence homes, and exact open proof portfolio are frozen without claiming interaction, admission, execution, or product behavior"
ledger = "plans/worth-ui/milestone-3.14-proof-ledger.csv"
phase_ledger = "plans/worth-ui/milestone-3.14-phase-1-proof-ledger.csv"

[public_contract]
intent_trait = "UiIntent"
definition = "UiIntentDefinition<I>"
provider = "UiIntentExecutionProvider<I>"
provider_create_phase = 4
declaration = "UiIntentDeclaration"
declaration_create_phase = 3
route = "UiIntentRouteBinding"
route_create_phase = 3
confirmation_route = "UiIntentConfirmationRouteBinding"
confirmation_route_create_phase = 3
route_source = "UiIntentRouteSource"
route_source_create_phase = 3
only_phase_3_route_source = "MountedInteraction"
definition_declaration_route_are_distinct = true
private_governed_construction = true
accepted_interactions_are_nonempty_canonical = true
string_intent_authority = false
callback_execution = false

[operability]
axes = ["support", "mutability", "readiness", "occupancy", "policy", "affinity", "confirmation"]
stored_operable_boolean = false
displayed_enabledness_is_authority = false
default_concurrency = "target-route-single-flight"

[execution]
destinations = ["ApplicationEffect", "UiTransition", "RuntimeService"]
outcomes = [
  "Completed",
  "RejectedBeforeEffect",
  "FailedBeforeEffect",
  "CancelledBeforeEffect",
  "TimedOutBeforeEffect",
  "Partial",
  "Indeterminate",
  "CompletedEffectConsequenceStopped",
]
ui_admission_is_domain_admission = false
ui_admission_is_query_admission = false

[native_reachability]
eframe_version = "0.31.1"
egui_version = "0.31.1"
egui_winit_version = "0.31.1"
winit_version = "0.30.13"
application_seam = "eframe::App::raw_input_hook"
source = "winit WindowEvent"
transport = "egui_winit RawInput.events"
consumer = "WorthUiHostEgui input translator"
button_position = "exact event position or same-sequence lossless position fact"
ime_phases = ["preedit", "commit", "cancel"]
canonical_text_range_unit = "UTF-8 byte offsets on Unicode scalar boundaries"
capabilities_come_from_installed_translators = true
generic_host_kind_implies_optional_input_support = false
phase_1_ingress_outcome = "Unsupported"
phase_2_translators = ["pointer", "keyboard", "text_ime"]
lifecycle_schema_version = 4
inherited_lifecycle_schema_versions = [2, 3]
executable_boundary = "process-bound Windows input -> winit WindowEvent -> egui RawInput -> WorthUiHostEgui reachability"

[ownership]
definition_owner = "worth-ui-runtime capability registry"
declaration_owner = "worth-ui-runtime declaration intent"
interaction_owner = "worth-ui-runtime interaction"
admission_owner = "worth-ui-runtime intent"
execution_owner = "worth-ui-runtime intent execution"
raw_query_owner = "worth-ui-query-binding"
query_product_audiences = ["worth-query-decl", "worth-query-host"]
runtime_host_dsl_import_query_mutation_authority = false
host_or_renderer_executes_provider = false

[budget]
active_pointer_global = 16
active_pointer_per_pointer = 1
draft_sessions = 16
draft_utf8_bytes_per_session = 65536
payload_fields = 64
payload_utf8_bytes = 65536
pending_challenges = 16
application_attempts = 16
provider_attempts = 16
intent_attempts = 16
retained_predecessor_versions = 16
diagnostic_summary_bytes = 4096
rich_evidence_bytes = 262144
ordinary_warm_seconds = 60
platform_pulse_seconds = 45

[evidence_topology]
new_test_target = false
new_compile_island = false
compile_owner = "scripts/ci/run_worth_ui_compile_contracts.py"
compile_sessions = 2
topology_target = "worth-ui-certification topology_contracts"
application_target = "worth-ui-certification application_contracts"
product_target = "worth-ui-platform-pulse executable_world"

[phase_1_evidence]
native_reachability_command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --bin worth-ui-platform-pulse native_frame::input_reachability_tests -- --nocapture"
