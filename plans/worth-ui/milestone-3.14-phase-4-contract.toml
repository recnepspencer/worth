schema = "worth-ui.milestone-3.14.phase-4-contract.v1"
milestone = "3.14"
phase = 4
status = "closed"
ledger = "plans/worth-ui/milestone-3.14-phase-4-proof-ledger.csv"
predecessor_contract = "plans/worth-ui/milestone-3.14-phase-3-contract.toml"
closure_claim = "one exact admitted UI routing attempt executes through its typed destination, settles honestly, and submits one declared immutable consequence batch through the existing observation compiler"

[authority]
admission_truth = "move-only UiAdmittedIntent<I> backed by the exact Phase 3 candidate and reservations"
provider_truth = "one application-root UiIntentExecutionProvider<I> joined to the exact frozen definition slot"
reservation_truth = "atomic bounded application, destination, provider, intent, retained-byte, and occupancy reservation"
effect_truth = "provider-owned external effect behind a framework-owned attempt, deadline, cancellation, and idempotency identity"
settlement_truth = "first runtime-admitted terminal settlement for the exact generational attempt"
recovery_truth = "affine runtime recovery authority retaining the exact provider and idempotency version"
consequence_truth = "one immutable definition-authorized batch admitted through owner-specific 3.12 observations"
downstream_handoff = "complete in-process interaction-to-visible-consequence path with no Query or domain authority transfer"

[destination]
execution_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent_execution"
provider_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent_execution/provider"
fact_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/fact_contract/produced/intent.rs"
posture_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/mounting/projection/intent_posture"
declaration_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/declaration/intent"
facade_root = "workspaces/worth-ui/crates/worth-ui/src/facade/intent.rs"
certification_root = "workspaces/worth-ui/crates/worth-ui-certification/tests/application_contracts/intent/execution"

[limits]
maximum_application_attempts = 16
maximum_provider_attempts = 16
maximum_intent_attempts = 16
maximum_retained_payload_bytes = 4194304
maximum_consequences_per_attempt = 16
maximum_recovery_handles = 16
ordinary_warm_focused_ceiling_seconds = 10
ordering_permutations = 24
new_test_target = false

[compile_time_enforcement]
provider_and_definition_share_intent_type = true
provider_payload_and_outcome_are_associated_with_intent = true
admitted_intent_is_move_only = true
execution_attempt_is_move_only = true
terminal_settlement_is_affine = true
recovery_authority_is_move_only = true
reservations_are_not_product_surface = true
consequence_contract_is_required_declaration_typestate = true
query_authority_cannot_be_derived_from_ui_admission = true
renderer_and_adapter_cannot_invoke_providers = true

[forbidden]
ordinary_paths = [
    "Any or downcast payload or outcome recovery",
    "JSON, string-map, or string-key provider dispatch",
    "untyped closure or renderer callback execution",
    "provider invocation during admission or confirmation",
    "UI admission treated as Query or domain mutation authority",
    "direct graph, mounted, projection-cache, or renderer consequence mutation",
    "second execution or consequence event queue",
    "last-wins provider registration",
    "late or duplicate settlement producing a second consequence",
    "partial or indeterminate effect reported as rollback",
]

[[phase_gate]]
id = "P4-01"
owner = "Phase 4 contract and topology"
claim = "the execution authority split, capacities, terminal topology, compile-time fences, ordered gates, and Phase 3 handoff are mechanically frozen"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test topology_contracts milestone_314_phase4 -- --nocapture"

[[phase_gate]]
id = "P4-02"
owner = "typed provider composition"
claim = "each executable definition joins exactly one destination-correct typed provider during application preparation without payload or outcome erasure"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::execution::registration -- --nocapture"

[[phase_gate]]
id = "P4-03"
owner = "atomic execution reservation and dispatch handoff"
claim = "all declared capacity scopes reserve before Admitted and one move-only admission transfers its exact payload and reservation into one revalidated attempt"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::execution::reservation -- --nocapture"

[[phase_gate]]
id = "P4-04"
owner = "managed settlement and recovery"
claim = "the framework owns polling, deadline, cancellation, first terminal settlement, predecessor retention, idempotency, and honest partial or indeterminate recovery"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::execution::lifecycle -- --nocapture"

[[phase_gate]]
id = "P4-05"
owner = "declared consequence integration"
claim = "one completed effect narrows only definition-authorized consequences and admits the complete immutable batch through one existing observation turn or retains consequence-only recovery"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::execution::consequence -- --nocapture"

[[phase_gate]]
id = "P4-06"
owner = "Phase 4 adversarial worlds"
claim = "IA-07, IA-08, and all twenty-four IA-09 orders prove exact interruption, scoped independence, terminal honesty, canonical ordering, and zero execution residue"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::execution::phase4 -- --nocapture"

[[phase_gate]]
id = "P4-07"
owner = "Phase 4 closure"
claim = "focused, broad, topology, boundary, context, composition, warning, cost, and ledger evidence is green on exact final source"
command = "cargo run --manifest-path tools/boundary-check/Cargo.toml -- --root ."
