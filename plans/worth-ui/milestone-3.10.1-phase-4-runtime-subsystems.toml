schema = "worth-ui.milestone-3.10.1.phase-4-runtime-subsystems.v2"
canonical_product_transition = "WorthUiActiveApplicationSession::execute_mounted_frame"
certification_extension = "WorthUiFrameworkTurnCertificationExt::execute_framework_turn"

[[family]]
name = "application"
owner_kind = "state"
owner_file = "crates/worth-ui-runtime/src/runtime/session/application_state.rs"
owner_symbol = "WorthUiApplicationSessionState"
transition_files = [
  "crates/worth-ui-runtime/src/runtime/session/application_state/framework_turn.rs",
  "crates/worth-ui-runtime/src/runtime/session/application_state/replacement.rs",
]
authority_in = "prepared application authority and active runtime"
authority_out = "generation-bound framework turns and prepared/committed application replacements"
failure_owner = "application transition denial"
preservation = "denial retains the complete predecessor app, plan, allocation, and query truth"
cost_lane = "framework planning counters and reload lowering receipts"
future_insertion = "Milestone 3.11 visual snapshot generation binding and Milestone 3.12 hot-rebind commit"
topology_rule = "application exposes named transitions and never lends WorthUiApp or WorthUiRuntime"
allowed_family_dependencies = ["graph", "planning"]

[[family]]
name = "graph"
owner_kind = "state"
owner_file = "crates/worth-ui-runtime/src/graph/snapshot/graph_snapshot.rs"
owner_symbol = "UiGraphSnapshot"
transition_files = [
  "crates/worth-ui-runtime/src/graph/snapshot/graph_snapshot.rs",
  "crates/worth-ui-runtime/src/graph/mutation/mod.rs",
]
authority_in = "sealed declaration and admitted graph mutations"
authority_out = "generation-bound graph authority and successor snapshots"
failure_owner = "graph mutation/admission denial"
preservation = "failed mutation cannot replace snapshot or indexes"
cost_lane = "graph mutation and dependency-impact counters"
future_insertion = "Milestone 3.12 affected-aspect and consumed-fact lookup"
topology_rule = "graph must not import mounting; mounting may consume graph authority"
allowed_family_dependencies = []

[[family]]
name = "planning"
owner_kind = "state"
owner_file = "crates/worth-ui-runtime/src/runtime/planning/allocation_planning/plan.rs"
owner_symbol = "WorthUiAllocationPlanning"
transition_files = [
  "crates/worth-ui-runtime/src/runtime/planning/transitions.rs",
  "crates/worth-ui-runtime/src/runtime/planning/allocation_planning/admission.rs",
]
authority_in = "graph authority, admitted measurement basis, and query facts"
authority_out = "sealed execution plans and allocation-planning receipts"
failure_owner = "planning or allocation admission denial"
preservation = "denial leaves active plan and committed allocation truth unchanged"
cost_lane = "planning, projection, and allocation counters"
future_insertion = "Milestone 3.12 rebind planning and Milestone 3.17 runtime evaluation of sealed DSL expression artifacts"
topology_rule = "planning consumes graph authority and cannot mutate mounted or observation truth"
allowed_family_dependencies = ["graph"]

[[family]]
name = "mounting"
owner_kind = "state"
owner_file = "crates/worth-ui-runtime/src/mounting/session_state.rs"
owner_symbol = "WorthUiMountedSessionState"
transition_files = [
  "crates/worth-ui-runtime/src/mounting/session_state/projection.rs",
  "crates/worth-ui-runtime/src/mounting/session_state/publication.rs",
  "crates/worth-ui-runtime/src/mounting/session_state/replacement.rs",
]
authority_in = "application generation, graph authority, plan receipts, host capability, and prepared frames"
authority_out = "mounted publication receipts, in-flight handles, and typed replacement successors"
failure_owner = "mounted identity, retention, admission, or completion denial"
preservation = "denial preserves predecessor mounted identity and publication; replacement successors remain unpublished"
cost_lane = "mount assembly, retention, adapter, rejection, and publication counters"
future_insertion = "Milestone 3.11 mounted identity capture and Milestone 3.16 appearance projection and publication"
topology_rule = "facades receive named mounted transitions, never identity/retention/presentation fields"
allowed_family_dependencies = ["application", "graph", "planning"]

[[family]]
name = "observation"
owner_kind = "state"
owner_file = "crates/worth-ui-runtime/src/host_exchange/session_state.rs"
owner_symbol = "WorthUiHostExchangeSessionState"
transition_files = [
  "crates/worth-ui-runtime/src/host_exchange/session_state/observation.rs",
  "crates/worth-ui-runtime/src/host_exchange/session_state/measurement.rs",
]
authority_in = "host transport batches and mounted terminal evidence"
authority_out = "structurally validated retained reports and measurement receipts"
failure_owner = "host exchange validation/admission denial"
preservation = "invalid or over-capacity input cannot mutate mounted or application truth"
cost_lane = "transport validation, quarantine, observation, and measurement work reports"
future_insertion = "Milestone 3.12 semantic observation admission before bounded rebind planning"
topology_rule = "observation consumes read-only mounted validation basis and cannot publish frames"
allowed_family_dependencies = ["mounting"]

[[family]]
name = "inspection"
owner_kind = "stateless-contract"
owner_file = "crates/worth-ui-runtime/src/inspection/mounted_frame/mod.rs"
owner_symbol = "UiMountedInspectionRequest"
transition_files = [
  "crates/worth-ui-runtime/src/inspection/mounted_frame/receipt.rs",
  "crates/worth-ui-runtime/src/facade/inspection_bridge/mod.rs",
]
authority_in = "read-only graph, planning, mounting, and observation projections"
authority_out = "compact generation-bound inspection receipts"
failure_owner = "inspection relevance or retention denial"
preservation = "inspection cannot mutate or reconstruct operational truth"
cost_lane = "inspection lookup, index probe, and materialization counters"
future_insertion = "Milestone 3.11 pixel and region to mounted-receipt identity bridges plus later read-only inspection families"
topology_rule = "inspection projections contain no mutable operational authority"
allowed_family_dependencies = ["application", "graph", "mounting", "observation", "planning"]

[[family]]
name = "session"
owner_kind = "composition-root"
owner_file = "crates/worth-ui-runtime/src/facade/entry/active_application_session.rs"
owner_symbol = "WorthUiActiveApplicationSession"
transition_files = [
  "crates/worth-ui-runtime/src/facade/entry/mounted_frame_execution.rs",
  "crates/worth-ui-runtime/src/facade/entry/application_replacement/cutover.rs",
]
authority_in = "application, host-session, mounted, and host-exchange aggregates"
authority_out = "product mounted-frame and lifecycle outcomes"
failure_owner = "the subsystem transition that denied"
preservation = "composition order never publishes a partial cross-subsystem successor"
cost_lane = "carried subsystem receipts; the session owns no duplicate counter truth"
future_insertion = "orchestration only when a future transition spans established owners"
topology_rule = "thin composition root coordinates aggregates without exposing or duplicating their fields"
allowed_family_dependencies = ["application", "inspection", "mounting", "observation"]

[[future_insertion]]
milestone = "3.11"
roadmap_heading = "### Milestone 3.11: Visual Snapshot Receipts and Hit-Test Identity Bridge"
change = "visual snapshot truth and mounted-receipt identity bridge"
owner_scope = "runtime-family"
owner = "application"
insertion = "application replacement preparation and commit"
forbidden_owner = "session"

[[future_insertion]]
milestone = "3.12"
roadmap_heading = "### Milestone 3.12: Observation Intake and Hot Rebind Planner"
change = "semantic host observation admission before bounded hot-rebind planning"
owner_scope = "runtime-family"
owner = "observation"
insertion = "after structural host-report validation"
forbidden_owner = "mounting"

[[future_insertion]]
milestone = "3.17"
roadmap_heading = "### Milestone 3.17: DSL Expressions, Conditions, and Semantic Evaluation"
change = "runtime evaluation and invalidation of sealed DSL expression artifacts"
owner_scope = "runtime-family"
owner = "planning"
insertion = "planning input handoff before active-plan publication"
forbidden_owner = "session"

[[future_insertion]]
milestone = "3.18"
roadmap_heading = "### Milestone 3.18: DSL Composition, Modules, and Lowering Equivalence"
change = "module and composition lowering before the sealed semantic handoff"
owner_scope = "external-authority"
owner = "worth-ui-dsl"
insertion = "before the sealed semantic handoff; no runtime subsystem insertion"
forbidden_owner = "session"

[[crate_decision]]
scope = "all-seven-families"
decision = "retain internal module boundaries in Phase 4"
independent_authority = "application, mounting, and observation are session-coupled; graph/planning/inspection already have stable internal authorities"
stable_directional_api = "not yet independent from worth-ui-runtime facade and receipt vocabulary"
dependency_effect = "extraction would introduce shared facade/receipt dependencies or reverse edges"
compile_cost_effect = "new crates would multiply compile units before public contracts stabilize"
cycle_analysis = "graph -> planning/application -> mounting -> observation/inspection remains acyclic internally"
why_internal_is_sufficient = "private fields, typed transitions, hostile compile contracts, and topology audits enforce the Phase 4 boundary"
