schema = "worth-ui.milestone-3.12.phase-1-contract.v1"
milestone = "3.12"
phase = 1
status = "closed"
closure_claim = "every current change route is adjudicated, future ownership is frozen, inherited protocol evidence is provenance-safe, and later phases cannot introduce a second ordinary executor"

[authority_progression]
ordinary = "settled source snapshot -> source rebind attempt -> admitted owner evidence -> non-empty ordered turn -> classified change -> resolved affected scope -> immutable rebind plan -> prepared rebind -> canonical presentation -> atomic publication -> terminal receipt"
advanced = "active-session authority may expose the same governed phases, but only the proof type from one phase can open the next"
forbidden_inputs = ["raw watcher hint", "raw source bytes", "raw host report", "raw measurement result", "raw Query artifact", "pixel identity", "inspection reference", "generic authority marker"]
required_subsystems = ["runtime observation state", "runtime rebind state"]
public_executor = "WorthUiNativeApplicationShell::begin_source_rebind"

[outcome_topology]
terminal = ["Duplicate", "ObservedNoChange", "RejectedBeforeEffects", "CancelledBeforeEffects", "TimedOutBeforeEffects", "SupersededBeforeEffects", "Published", "InFlight", "Indeterminate", "InternalDefect"]
publication_receipt_owner = "Published"
managed_authority = ["InFlight", "Indeterminate"]
pre_effect_preservation = ["RejectedBeforeEffects", "CancelledBeforeEffects", "TimedOutBeforeEffects", "SupersededBeforeEffects"]

[ordering]
cross_family = "framework rank plus owner-issued ordering key"
forbidden = "global wall-clock order"
atomic_turn = "one rejected required item rejects the turn; typed unavailable optional families do not become fake members"
coalescing = "only owner-proven equivalent entries under the sealed family definition"

[protocol]
identity = "worth-ui.platform-pulse.lifecycle-observation"
producer_version = 3
accepted_versions = [2, 3]
v2_posture = "InheritedLifecycleOnly"
v2_fixture_root = "workspaces/worth-ui/apps/platform-pulse/tests/fixtures/lifecycle_protocol/v2"
failure_artifact_identity = "worth-ui.platform-pulse.failure-artifact.v1"
failure_artifact_posture = "separate normalized diagnostic bundle; never a raw lifecycle envelope"

[inspection]
authority = "immutable bounded projections from retained terminal receipts"
supported = ["summary", "exact-key reference lookup", "rebind decision record", "visual snapshot comparison"]
deferred = ["materialized causal diagnostics", "replay", "human and agent inspector"]
forbidden = "construct, execute, retry, amend, or republish runtime authority"

[platform_pulse_profile]
profile_identity = "worth-ui.platform-pulse.change-profile.v1"
admitted_observations_per_turn = 8
retained_observation_bytes_per_turn = 65536
queued_observations_during_effecting_rebind = 16
changed_facts = 16
affected_aspects = 16
distinct_indexed_consumers = 64
graph_index_and_mounted_lifecycle_entries = 128
measurement_allocation_entries = 64
query_binding_transitions = 16
obligations = 64
native_surfaces = 1
prepared_presentation_bytes = 4194304
pending_plans = 2
effecting_rebinds = 1
completion_handles = 1
recovery_handles = 1
retained_terminal_decision_records = 64
evidence_linkage_entries = 512
causal_neighborhood_bytes = 262144
retained_comparison_snapshots = 2
retained_comparison_rebind_receipts = 1
comparison_structural_entries = 128
comparison_pixel_bytes = "already-retained bytes only; no duplicate buffer"

[cost]
source_edit = "source settlement plus one full-file DSL compilation"
post_classification = "O + F + A + C + R + G + M + B"
ordinary_presentation = "S + P + N"
completion = "Xc"
recovery = "Xr"
unchanged = "zero observation, classification, rebind, comparison, and pixel work"

[[future_insertion]]
milestone = "3.13"
owner = "Query projection"
home = "runtime/observation/admission/query plus owner-issued fact payloads and binding strategies"
forbidden_reopen = "raw Query operations, observation turn, planner, or publication boundary"

[[future_insertion]]
milestone = "3.14"
owner = "intent"
home = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent"
forbidden_reopen = "raw host input or mounted identity as intent authority"

[[future_insertion]]
milestone = "3.15"
owner = "services"
home = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/service"
forbidden_reopen = "service requests inside rebind observation or parallel publication"

[[route]]
id = "R-01"
family = "source settlement"
current_entry = "WorthUiFilesystemSourceWatcher::settle"
current_owner = "worth-ui-runtime runtime/source_ingress/filesystem_watcher"
current_terminal = "WorthUiSettledSourceSnapshot"
disposition = "retained proof producer"
successor_home = "runtime/source_ingress/source_rebind_attempt"
cutover_phase = 2

[[route]]
id = "R-02"
family = "settled source compilation"
current_entry = "WorthUiSettledSourceSnapshot::lower_to_candidate_submission"
current_owner = "worth-ui-runtime runtime/source_ingress/candidate_submission.rs"
current_terminal = "WorthUiWatchedCandidateSubmission or WorthUiWatchedCandidateSubmissionDenial"
disposition = "canonical cutover"
successor_home = "runtime/source_ingress/source_rebind_attempt"
cutover_phase = 2

[[route]]
id = "R-03"
family = "product source lowering"
current_entry = "Platform Pulse application.rs and native_frame.rs call lower_to_candidate_submission"
current_owner = "worth-ui-platform-pulse"
current_terminal = "candidate submission or predecessor-preserving denial"
disposition = "deleted predecessor"
successor_home = "Platform Pulse application.rs calls WorthUiSettledSourceSnapshot::attempt_source_rebind for initial admission and native_frame/rebind.rs calls WorthUiNativeApplicationShell::begin_source_rebind for watched changes"
cutover_phase = 2

[[route]]
id = "R-04"
family = "raw host observation validation"
current_entry = "WorthUiHostObservationSessionExt::validate_host_observation_batch"
current_owner = "worth-ui-runtime host_exchange/observation_report_validation"
current_terminal = "UiHostObservationReportOutcome"
disposition = "retained proof producer"
successor_home = "runtime/observation/admission/host"
cutover_phase = 2

[[route]]
id = "R-05"
family = "bounded host observation drain"
current_entry = "WorthUiHostObservationSessionExt::validate_enqueued_host_observation_batches"
current_owner = "worth-ui-runtime facade/entry/observation_report.rs"
current_terminal = "validated, duplicate, quarantined, or denied batches"
disposition = "canonical cutover"
successor_home = "host-contract drain -> host-egui retention -> runtime observation admission"
cutover_phase = 2

[[route]]
id = "R-06"
family = "other host families"
current_entry = "validated pointer, keyboard, focus, scroll, clock, tick, and composition reports"
current_owner = "worth-ui-host-contract observation_report"
current_terminal = "validated mechanical evidence only"
disposition = "typed unavailable family"
successor_home = "future runtime/intent or runtime/service owner"
cutover_phase = 2

[[route]]
id = "R-07"
family = "solicited measurement"
current_entry = "WorthUiHostMeasurementSessionExt begin/complete/cancel/expire"
current_owner = "worth-ui-runtime host_exchange/measurement_admission"
current_terminal = "UiHostMeasurementOutcome"
disposition = "retained proof producer"
successor_home = "runtime/observation/admission/measurement"
cutover_phase = 2

[[route]]
id = "R-08"
family = "Query collection consequence"
current_entry = "WorthUiFrameworkTurnSource::admit_collection_change"
current_owner = "worth-ui-query-binding collection_delivery"
current_terminal = "move-only WorthUiCollectionChangeConsequence"
disposition = "retained proof producer"
successor_home = "runtime/observation/admission/query"
cutover_phase = 2

[[route]]
id = "R-09"
family = "viewport consequence"
current_entry = "WorthUiFrameworkTurnCompletion::ViewportResizeResolved"
current_owner = "worth-ui-runtime runtime/viewport_resize"
current_terminal = "UiViewportCommittedReplan"
disposition = "retained proof producer"
successor_home = "runtime/observation/admission/runtime_state"
cutover_phase = 2

[[route]]
id = "R-10"
family = "committed scroll consequence"
current_entry = "UiAllocationInvalidationAdmissionContext::committed_scroll_sources"
current_owner = "worth-ui-runtime runtime/invalidation_narrowing"
current_terminal = "UiCommittedScrollActivationSource"
disposition = "retained proof producer"
successor_home = "runtime/observation/admission/runtime_state"
cutover_phase = 2

[[route]]
id = "R-11"
family = "committed portal consequence"
current_entry = "UiAllocationInvalidationAdmissionContext::committed_portal_source"
current_owner = "worth-ui-runtime runtime/invalidation_narrowing"
current_terminal = "UiCommittedPortalActivationSource"
disposition = "retained proof producer"
successor_home = "runtime/observation/admission/runtime_state"
cutover_phase = 2

[[route]]
id = "R-12"
family = "affected-scope invalidation"
current_entry = "runtime/invalidation_narrowing::narrow_resolved_frame"
current_owner = "worth-ui-runtime runtime/invalidation_narrowing"
current_terminal = "UiNarrowedAllocationFramePlan"
disposition = "canonical cutover"
successor_home = "fact_contract plus runtime/rebind/scope and planning"
cutover_phase = 3

[[route]]
id = "R-13"
family = "ordinary replacement executor"
current_entry = "WorthUiNativeApplicationShell::replace_application"
current_owner = "worth-ui-runtime facade/entry/native_application_replacement.rs"
current_terminal = "WorthUiNativeApplicationReplacementOutcome"
disposition = "canonical cutover"
successor_home = "WorthUiNativeApplicationShell::begin_source_rebind"
cutover_phase = 4

[[route]]
id = "R-14"
family = "advanced public replacement executor"
current_entry = "facade/entry/application_replacement.rs"
current_owner = "worth-ui-runtime"
current_terminal = "public preparation, activation, and retry surfaces"
disposition = "deleted predecessor"
successor_home = "facade/entry/rebind"
cutover_phase = 4

[[route]]
id = "R-15"
family = "application activation publication"
current_entry = "WorthUiActiveApplicationSession::commit_application_activation"
current_owner = "worth-ui-runtime facade/entry/application_replacement/cutover.rs"
current_terminal = "WorthUiApplicationCutoverReceipt"
disposition = "retained proof producer"
successor_home = "inherited canonical publication boundary"
cutover_phase = 4

[[route]]
id = "R-16"
family = "mounted identity publication"
current_entry = "WorthUiMountedSessionState::commit_graph_replacement_successor"
current_owner = "worth-ui-runtime mounting/session_state/replacement.rs"
current_terminal = "mounted graph replacement successor"
disposition = "retained proof producer"
successor_home = "inherited canonical publication boundary"
cutover_phase = 4

[[route]]
id = "R-17"
family = "host presentation publication"
current_entry = "UiMountedFramePublicationCandidate::commit_presented"
current_owner = "worth-ui-runtime mounting/publication.rs"
current_terminal = "UiMountedFramePublicationReceipt"
disposition = "retained proof producer"
successor_home = "inherited canonical presentation and publication boundary"
cutover_phase = 4

[[route]]
id = "R-18"
family = "identity-aware visual comparison"
current_entry = "Milestone 3.11 comparison successor home is intentionally unpopulated"
current_owner = "worth-ui-inspection immutable evidence plus worth-ui-runtime authority"
current_terminal = "typed unavailable before Milestone 3.12 Phase 4"
disposition = "committed successor"
successor_home = "inspection/visual_snapshot/comparison and worth-ui-inspection/snapshot/comparison"
cutover_phase = 4

[[module_home]]
owner = "source attempt"
path = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/source_ingress/source_rebind_attempt"

[[module_home]]
owner = "observation authority"
path = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/observation"

[[module_home]]
owner = "produced and consumed fact contracts"
path = "workspaces/worth-ui/crates/worth-ui-runtime/src/fact_contract"

[[module_home]]
owner = "rebind scope and planning"
path = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/rebind"

[[module_home]]
owner = "rebind public facade"
path = "workspaces/worth-ui/crates/worth-ui-runtime/src/facade/entry/rebind"

[[module_home]]
owner = "rebind inspection projections"
path = "workspaces/worth-ui/crates/worth-ui-inspection/src/receipt/rebind"

[[module_home]]
owner = "visual comparison runtime"
path = "workspaces/worth-ui/crates/worth-ui-runtime/src/inspection/visual_snapshot/comparison"

[[module_home]]
owner = "visual comparison meaning"
path = "workspaces/worth-ui/crates/worth-ui-inspection/src/snapshot/comparison"

[[module_home]]
owner = "product orchestration"
path = "workspaces/worth-ui/apps/platform-pulse/src/bounded_rebind_pulse.rs"

[[module_home]]
owner = "independent certification"
path = "workspaces/worth-ui/crates/worth-ui-certification/tests/application_contracts/observation_rebind"

[[forbidden_dependency]]
from = "worth-ui-host-contract"
forbidden = ["worth-ui-runtime", "worth-ui-inspection", "worth-query"]

[[forbidden_dependency]]
from = "worth-ui-inspection"
forbidden = ["worth-ui-runtime", "worth-ui-host-egui", "worth-query"]

[[forbidden_dependency]]
from = "worth-ui-platform-pulse"
