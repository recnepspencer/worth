schema = "worth-ui.milestone-3.12.phase-4-contract.v1"
milestone = "3.12"
phase = 4
status = "closed"
ledger = "plans/worth-ui/milestone-3.12-phase-4-proof-ledger.csv"
closure_claim = "one exact rebind plan crosses the inherited host effect and atomic publication boundaries through owned typed state, with bounded evidence, comparison, protocol, and teardown"

[[phase_gate]]
id = "P4-01"
owner = "required rebind runtime state"
claim = "every active, successor, fork, replacement, and shutdown path owns one required bounded rebind state"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-runtime runtime::rebind::execution::state -- --nocapture"

[[phase_gate]]
id = "P4-02"
owner = "final plan admission"
claim = "only an exact current immutable plan can reserve execution capacity and advance to move-only prepared authority"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-runtime runtime::rebind::execution::admission -- --nocapture"

[[phase_gate]]
id = "P4-03"
owner = "fallible preparation"
claim = "graph, allocation, binding, obligation, mounted, retention, presentation, and failure evidence are prepared before the first host effect"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-runtime runtime::rebind::execution::preparation -- --nocapture"

[[phase_gate]]
id = "P4-04"
owner = "canonical effect and publication path"
claim = "prepared rebind work presents through the inherited host contract and publishes only through the inherited atomic application boundary"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts observation_rebind::effect_recovery -- --nocapture"

[[phase_gate]]
id = "P4-05"
owner = "typed terminal topology"
claim = "every pre-effect and post-effect stop maps to the required typed outcome without false rollback, false success, or lost authority"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts observation_rebind -- --nocapture"

[[phase_gate]]
id = "P4-06"
owner = "managed completion and recovery"
claim = "in-flight and indeterminate work remains runtime-owned, bounded, enumerable, completable or disposable, and shutdown-safe"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts observation_rebind::lifecycle_cleanup -- --nocapture"

[[phase_gate]]
id = "P4-07"
owner = "authoritative rebind receipt"
claim = "published receipt proves exact predecessor and successor identity, planned and realized consequences, cost, retention, and zero recovery authority"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts observation_rebind::effect_recovery -- --nocapture"

[[phase_gate]]
id = "P4-08"
owner = "bounded decision evidence"
claim = "source, fact, scope, stop-point, decision, and structural-cost references derive from retained terminal receipts without execution authority"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-inspection rebind -- --nocapture"

[[phase_gate]]
id = "P4-09"
owner = "visual snapshot comparison"
claim = "a concrete comparison grant borrows two exact snapshots and one published rebind receipt and returns a bounded typed comparison without recapture or pixel identity inference"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts visual_snapshot::comparison -- --nocapture"

[[phase_gate]]
id = "P4-10"
owner = "native shell cutover"
claim = "the ordinary native shell begins source rebind from a settled snapshot and exposes no raw whole-application replacement mutation"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test topology_contracts milestone_312_phase4 -- --nocapture"

[[phase_gate]]
id = "P4-11"
owner = "Platform Pulse observation and rebind"
claim = "the production watcher feeds the canonical observation-to-plan-to-rebind route and malformed source preserves the predecessor"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --lib -- --nocapture"

[[phase_gate]]
id = "P4-12"
owner = "lifecycle protocol v3"
claim = "the producer emits typed v3 rebind and comparison families while the decoder treats governed raw v2 as inherited lifecycle only and keeps failure artifacts separate"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse observation_contract -- --nocapture"

[[phase_gate]]
id = "P4-13"
owner = "same-process Platform Pulse journey"
claim = "one process proves valid edit, malformed preservation, recovery, comparison, normal close, and zero retained resources"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-platform-pulse --features executable-world --test executable_world -- --nocapture"

[[phase_gate]]
id = "P4-14"
owner = "Phase 4 compile authority"
claim = "raw candidates, stale plans, double execution, forged grants, and wrong-phase values cannot cross governed boundaries"
command = "python scripts/ci/run_worth_ui_compile_contracts.py"

[[phase_gate]]
id = "P4-15"
owner = "Phase 4 final closure"
claim = "all focused and broad tests, warnings, composition, ledger, boundary, agent-context, and line-cap gates pass on final source"
command = "cargo run --manifest-path tools/boundary-check/Cargo.toml -- --root . && cargo run --manifest-path tools/agent-context/Cargo.toml -- check"
