schema = "worth-ui.milestone-3.14.phase-3-contract.v1"
milestone = "3.14"
phase = 3
status = "closed"
ledger = "plans/worth-ui/milestone-3.14-phase-3-proof-ledger.csv"
predecessor_contract = "plans/worth-ui/milestone-3.14-phase-2-contract.toml"
closure_claim = "one exact semantic interaction can become a coherent payload-and-operability-checked admitted UI routing attempt without gaining execution or effect authority"

[authority]
definition_truth = "frozen Rust-registered UiIntentDefinition<I>"
authored_truth = "canonical file or Rust-authored semantic artifact"
route_source = "sealed UiIntentRouteSource::MountedInteraction"
target_truth = "current mounted interaction affinity"
payload_truth = "one phase-scoped immutable input basis over declared owners"
operability_truth = "runtime-derived closed axes over the same input basis"
confirmation_truth = "one runtime-owned affine challenge slot"
downstream_handoff = "move-only admitted intent with no provider invocation surface"

[destination]
declaration_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/declaration/intent"
payload_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent/payload"
operability_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent/operability"
confirmation_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent/confirmation"
admission_root = "workspaces/worth-ui/crates/worth-ui-runtime/src/runtime/intent/admission"
dsl_root = "workspaces/worth-ui/crates/worth-ui-dsl/src/semantic/intent"
certification_root = "workspaces/worth-ui/crates/worth-ui-certification/tests/application_contracts/intent"

[limits]
maximum_payload_fields = 64
maximum_pending_challenges = 16
maximum_routes_per_application = 65536
ordinary_warm_focused_ceiling_seconds = 10
scale_lane = "named closure-stress tests inside existing targets"
new_test_target = false

[compile_time_enforcement]
product_and_confirmation_routes_are_distinct = true
payload_and_operability_share_one_basis_type = true
challenge_is_move_only = true
admitted_intent_is_move_only = true
definition_and_payload_share_intent_type = true
file_source_cannot_mint_definition = true
raw_observation_cannot_enter_admission = true
diagnostics_cannot_enter_admission = true

[forbidden]
ordinary_paths = [
    "renderer or adapter callback execution",
    "raw host observation to intent admission",
    "string or digest intent authority",
    "static enabled or readiness boolean as admission authority",
    "Any, JSON, or string-map payload authority",
    "parallel interaction or intent queue",
    "confirmation boolean or dialog result as continuation authority",
    "provider invocation before Phase 4",
]

[[phase_gate]]
id = "P3-01"
owner = "Phase 3 contract and topology"
claim = "the Phase 3 authority split, destination tree, limits, compile-time fences, ordered gates, and predecessor handoff are mechanically frozen"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test topology_contracts milestone_314_phase3 -- --nocapture"

[[phase_gate]]
id = "P3-02"
owner = "canonical intent declaration and compact route"
claim = "file and Rust authorship converge on one definition-resolved declaration and one unambiguous compact mounted interaction route"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::declaration -- --nocapture"

[[phase_gate]]
id = "P3-03"
owner = "coherent typed payload"
claim = "declared payload fields project from one immutable owner-revision basis and reject mixed, stale, malformed, preedit, positional, and over-budget input"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::payload::ia_05 -- --nocapture"

[[phase_gate]]
id = "P3-04"
owner = "orthogonal operability"
claim = "seven closed axes derive one machine-readable decision and only the exact fully operable decision mints an advancing proof"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::operability::ia_04 -- --nocapture"

[[phase_gate]]
id = "P3-05"
owner = "affine confirmation"
claim = "one bounded runtime-owned challenge consumes one exact prepared candidate and every stale, foreign, duplicate, ambiguous, expired, cancelled, or replayed continuation stops"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::confirmation::ia_06 -- --nocapture"

[[phase_gate]]
id = "P3-06"
owner = "effect-free UI admission and Phase 3 scale"
claim = "one sealed semantic interaction becomes one move-only admitted routing attempt while route, payload, operability, challenge, and admission work obey the Phase 3 IA-10 and IA-11 subsets"
command = "cargo test --manifest-path workspaces/worth-ui/Cargo.toml -p worth-ui-certification --test application_contracts intent::admission::phase3 -- --nocapture"

[[phase_gate]]
id = "P3-07"
owner = "Phase 3 closure"
claim = "focused, broad, topology, boundary, context, composition, warning, cost, and ledger evidence is green on exact final source"
command = "cargo run --manifest-path tools/boundary-check/Cargo.toml -- --root ."
