name: Store certificate roster scale

on:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-roster:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '8'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: workspaces/worth-store
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-nextest
      - name: Checkpoint and recover all 64 certificate records
        run: >-
          cargo nextest run --profile ci --cargo-profile ci-test
          -p worth-store-court-recovery-runtime-replication-production-entry-certified-release-serving --features worth-store-recovery-runtime/certification-test-authority
          --test worth_store_court_recovery_runtime_replication_production_entry_certified_release_serving --run-ignored only --no-tests=fail
          -E 'test(/^cost::recovery_runtime::production_entry::certified_release_serving::certificate_roster_scale::/)'
