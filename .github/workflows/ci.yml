name: WORTH CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches:
      - master
      - main
      # SDK increments target these branches while their prerequisites await CI.
      - codex/query-bounded-package-identity-2026-10-07
      - codex/query-retired-output-readiness-2026-10-07
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  line-cap:
    name: Rust line cap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the 400-line Rust file cap
        run: bash scripts/ci/check_workspace_rust_line_caps.sh workspace

  boundary-check:
    name: Boundary and facade doc check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Cache Cargo sources and tool builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/boundary-check/target
            tools/agent-context/target
          key: ${{ runner.os }}-boundary-tools-1.94.0-${{ hashFiles('tools/boundary-check/Cargo.lock', 'tools/agent-context/Cargo.lock', 'tools/boundary-check/src/**', 'tools/agent-context/src/**') }}
          restore-keys: |
            ${{ runner.os }}-boundary-tools-1.94.0-
      # The one constitution entrypoint the hook and the terminal also run:
      # crate boundaries, facades, facade docs and agent context.
      - name: Check the constitution
        shell: pwsh
        run: ./scripts/check-constitution.ps1

  query-checkpoint-recovery:
    name: Query checkpoint recovery court
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Admitted canonical preparation requires the audited std-sort implementation
      # selected by worth-foundational/build.rs. Other compilers remain refused.
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Record the audited compiler identity
        run: rustc --version --verbose
      # The default run proves the shipped build. The featured run is not a
      # superset of it: test-invalidation-equivalence also runs a full
      # verification under the same admission, so exhaustion behaves
      # differently. It adds observer, operation-control, delivery-fault and
      # equivalence courts on top.
      - name: Prove restored accepted outputs avoid producer contact
        run: >-
          cargo test
          --manifest-path workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml
          -p worth-query-topology-entry
          -- --test-threads=1
      # The external consumer journey: publication, reconstruction, output
      # preservation and optional output roles through the public facades.
      - name: Run the public consumer journey
        run: >-
          cargo run
          --manifest-path workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml
          -p worth-query-consumer-root
      - name: Prove featured topology courts
        run: >-
          cargo test
          --manifest-path workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml
          -p worth-query-topology-entry
          --features test-query-execution-observer,test-world-operation-control,test-invalidation-equivalence,test-output-delivery-faults
          -- --test-threads=1
