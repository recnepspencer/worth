name: WORTH CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches:
      - master
      - main
      # SDK increments target these branches while their prerequisites await CI.
      - codex/query-bounded-package-identity-2026-10-07
      - codex/query-retired-output-readiness-2026-10-07
  workflow_dispatch:
    inputs:
      scope:
        description: Jobs to run
        type: choice
        default: all
        options: [all, consumer-docs, checkpoint-only]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumer-docs:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'checkpoint-only'
    name: Consumer documentation and doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache compatible consumer Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/*
            !target/debug/incremental
            workspaces/worth-query/target/debug/*
            !workspaces/worth-query/target/debug/incremental
            workspaces/worth-query-bank-world/target/debug/*
            !workspaces/worth-query-bank-world/target/debug/incremental
            workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/target/debug/*
            !workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/target/debug/incremental
          key: ${{ runner.os }}-${{ runner.arch }}-consumer-debug-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', '.cargo/config*', 'workspaces/worth-query/Cargo.toml', 'workspaces/worth-query/.cargo/config*', 'workspaces/worth-query-bank-world/Cargo.toml', 'workspaces/worth-query-bank-world/.cargo/config*', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/.cargo/config*') }}-${{ hashFiles('Cargo.lock', 'workspaces/worth-query/Cargo.lock', 'workspaces/worth-query-bank-world/Cargo.lock', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-consumer-debug-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', '.cargo/config*', 'workspaces/worth-query/Cargo.toml', 'workspaces/worth-query/.cargo/config*', 'workspaces/worth-query-bank-world/Cargo.toml', 'workspaces/worth-query-bank-world/.cargo/config*', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/.cargo/config*') }}-
      - name: Test build identity issuance
        run: python -m unittest discover -s scripts/ci -p test_application_build.py
      - name: Compile and run configured Query and Bank doctests
        run: python scripts/ci/query_gate.py doc
      - name: Run the observable mixed workflow consumer
        run: >-
          python scripts/application_build.py cargo run --manifest-path workspaces/worth-query/Cargo.toml
          -p worth-query-certification --example observable_workflow
      - name: Preserve failed gate logs and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-docs-gate-failure
          path: |
            target/query-gate/*.log
            target/query-gate/*.json

  line-cap:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'consumer-docs' && inputs.scope != 'checkpoint-only')
    name: Rust line cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the 400-line Rust file cap
        run: bash scripts/ci/check_workspace_rust_line_caps.sh workspace
      - name: Keep every lockfile on the same dependency versions
        run: python3 scripts/ci/check_lockfile_alignment.py

  boundary-check:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'consumer-docs' && inputs.scope != 'checkpoint-only')
    name: Boundary and facade doc check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Cache Cargo sources and tool builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/constitution-tools
          key: ${{ runner.os }}-boundary-tools-1.99.1-${{ hashFiles('tools/boundary-check/Cargo.lock', 'tools/agent-context/Cargo.lock', 'tools/boundary-check/src/**', 'tools/agent-context/src/**') }}
          restore-keys: |
            ${{ runner.os }}-boundary-tools-1.99.1-
      # The explicit phase-end and landing constitution entrypoint:
      # crate boundaries, facades, facade docs and agent context.
      - name: Prepare constitution tools
        shell: pwsh
        run: ./scripts/prepare-constitution-hook.ps1
      - name: Check the constitution
        shell: pwsh
        env:
          WORTH_CONSTITUTION_PREBUILT: '1'
        run: ./scripts/check-constitution.ps1
      - name: Test the boundary checker
        run: cargo test --manifest-path tools/boundary-check/Cargo.toml --target-dir target/constitution-tools

  query-checkpoint-recovery:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'consumer-docs'
    name: Query checkpoint recovery court
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Admitted canonical preparation requires the audited std-sort implementation
      # selected by worth-foundational/build.rs. Other compilers remain refused.
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the audited compiler identity
        run: rustc --version --verbose
      - name: Cache compatible consumer Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/*
            !target/debug/incremental
            workspaces/worth-query/target/debug/*
            !workspaces/worth-query/target/debug/incremental
            workspaces/worth-query-bank-world/target/debug/*
            !workspaces/worth-query-bank-world/target/debug/incremental
            workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/target/debug/*
            !workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/target/debug/incremental
          key: ${{ runner.os }}-${{ runner.arch }}-consumer-debug-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', '.cargo/config*', 'workspaces/worth-query/Cargo.toml', 'workspaces/worth-query/.cargo/config*', 'workspaces/worth-query-bank-world/Cargo.toml', 'workspaces/worth-query-bank-world/.cargo/config*', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/.cargo/config*') }}-${{ hashFiles('Cargo.lock', 'workspaces/worth-query/Cargo.lock', 'workspaces/worth-query-bank-world/Cargo.lock', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-consumer-debug-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', '.cargo/config*', 'workspaces/worth-query/Cargo.toml', 'workspaces/worth-query/.cargo/config*', 'workspaces/worth-query-bank-world/Cargo.toml', 'workspaces/worth-query-bank-world/.cargo/config*', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml', 'workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/.cargo/config*') }}-
      # Isolate topology's process-wide controls while running independent courts
      # concurrently; the same runner includes owning-consumer and parameter courts.
      - name: Prove restored accepted outputs avoid producer contact
        run: python scripts/ci/query_gate.py fixture
      - name: Prove public output-role documentation contracts
        run: >-
          python scripts/application_build.py cargo test --doc
          --manifest-path workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml
          -p worth-query-topology-entry
      # The external consumer journey: publication, reconstruction, output
      # preservation and optional output roles through the public facades.
      - name: Run the public consumer journey
        run: >-
          time python scripts/application_build.py cargo run
          --manifest-path workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/Cargo.toml
          -p worth-query-consumer-root
      - name: Preserve failed court logs and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: query-checkpoint-recovery-failure
          path: |
            target/query-gate/*.log
            target/query-gate/*.json
            target/query-gate/*.jsonl
