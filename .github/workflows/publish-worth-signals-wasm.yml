name: Publish Worth Signals Wasm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish public npm package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install Binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install wasm package dev dependencies
        working-directory: crates/worth-signal-wasm
        run: npm ci

      - name: Build wasm package
        run: wasm-pack build crates/worth-signal-wasm --target bundler --profile release-wasm --no-opt --out-dir pkg

      - name: Optimize wasm (Track 6)
        run: node scripts/wasm/optimize-worth-signals-wasm.mjs crates/worth-signal-wasm/pkg

      - name: Prepare npm metadata
        env:
          WORTH_SIGNAL_WASM_PACKAGE_NAME: worth-signals-wasm
          WORTH_SIGNAL_WASM_REPOSITORY_URL: https://github.com/recnepspencer/forge.git
        run: node scripts/wasm/prepare-worth-signals-wasm-package.mjs crates/worth-signal-wasm/pkg

      - name: Verify npm package
        run: node scripts/wasm/verify-worth-signals-wasm-package.mjs crates/worth-signal-wasm/pkg

      - name: Verify public documentation coverage
        working-directory: crates/worth-signal-wasm
        run: |
          npm run test:documentation
          npm run typecheck:package-surface

      - name: Publish to npm
        working-directory: crates/worth-signal-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
