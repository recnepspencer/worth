[workspace]
"resolver" = "3"
"exclude" = ["workspaces/*", "workspaces/worth-contracts", "workspaces/worth-query", "workspaces/worth-query-bank-world", "workspaces/worth-store", "workspaces/worth-ui"]
"members" = ["crates/worth-court-execution", "crates/worth-court-foundational-certification-boundary-artifacts", "crates/worth-court-foundational-certification-boundary-evidence", "crates/worth-court-foundational-expressions", "crates/worth-court-proof", "crates/worth-court-relational-branch-reference-compile-time", "crates/worth-court-relational-certification", "crates/worth-court-runtime-bridge", "crates/worth-court-runtime-world", "crates/worth-court-server-certification-suite", "crates/worth-court-server-product-operation-phase-eleven", "crates/worth-court-server-product-operation-phase-thirteen-shared-read", "crates/worth-court-signal-branch-retention-contract", "crates/worth-court-signal-owner-services", "crates/worth-court-signal-wasm", "crates/worth-execution", "crates/worth-foundational", "crates/worth-harness", "crates/worth-proof", "crates/worth-relational", "crates/worth-runtime-bridge", "crates/worth-runtime-world", "crates/worth-server", "crates/worth-server-client-generation", "crates/worth-signal", "crates/worth-signal-wasm", "crates/worth-testkit-foundational", "crates/worth-testkit-relational", "crates/worth-testkit-server", "crates/worth-value-shape-derive"]


[workspace.metadata.worth_topology]
role = "thin_orchestrator"
road1_subworkspaces = ["workspaces/worth-contracts"]
forbidden_member_prefixes = ["workspaces/"]
boundary_check_manifest = "tools/boundary-check/Cargo.toml"
boundary_check_config = "tools/boundary-check/config/road1.toml"

[workspace.package]
rust-version = "1.94"
edition = "2024"
version = "0.1.0"
license = "BUSL-1.1"

[workspace.dependencies]
worth-harness = { path = "crates/worth-harness", version = "0.1.0" }
worth-runtime-bridge = { path = "crates/worth-runtime-bridge" }
worth-server = { path = "crates/worth-server" }
worth-server-client-generation = { path = "crates/worth-server-client-generation" }
worth-query = { path = "workspaces/worth-query/crates/worth-query" }
worth-query-decl = { path = "workspaces/worth-query/crates/worth-query-decl" }
worth-query-host = { path = "workspaces/worth-query/crates/worth-query-host" }
worth-query-publication = { path = "workspaces/worth-query/crates/worth-query-publication" }
worth-query-replay = { path = "workspaces/worth-query/crates/worth-query-replay" }
worth-schema-graph = { path = "workspaces/worth-contracts/crates/worth-schema-graph" }
worth-foundational = { path = "crates/worth-foundational" }
worth-proof = { path = "crates/worth-proof" }
worth-execution = { path = "crates/worth-execution" }
worth-signal = { path = "crates/worth-signal" }
worth-signal-wasm = { path = "crates/worth-signal-wasm" }
worth-relational = { path = "crates/worth-relational" }
worth-runtime-world = { path = "crates/worth-runtime-world" }

# Testing
trybuild = "1.0"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1"
allocator-api2 = "=0.2.21"

# ---- Workspace-wide lint policy ----
# These apply to every crate that declares `lints.workspace = true`.
# Warnings fail the build automatically - no need to remember `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"
# Phase-carried counter proofs are incremented where work occurs; a single
# initializer would conceal the phase that incurred each cost.
field_reassign_with_default = "allow"
# Exported outcome vocabulary keeps domain qualifiers, and stable nested
# topology may repeat a semantic root when child responsibilities differ.
enum_variant_names = "allow"
module_inception = "allow"
# Domain `from_*` transitions may borrow the authority-bearing receiver; they
# are not collection-conversion conventions.
wrong_self_convention = "allow"

# ---- Profile tuning ----
# Dev/test builds: opt-level 0 for workspace crates (fast iteration),
# opt-level 2 for all dependencies (cached anyway, full speed).
# line-tables-only keeps backtraces useful while skipping most PDB generation.
# For perf-sensitive runs: cargo build/test --profile perf
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package]
"*".opt-level = 2
# First-party crates owned by other workspaces arrive here as path dependencies,
# which "*" would optimize. They stay on the member profile so every workspace
# compiles them identically and editing one never pays an optimizing rebuild.
worth-query.opt-level = 0
worth-query-admission.opt-level = 0
worth-query-declaration.opt-level = 0
worth-query-execution.opt-level = 0
worth-query-host.opt-level = 0
worth-query-installation.opt-level = 0
worth-query-publication.opt-level = 0
worth-schema-graph.opt-level = 0

[profile.test]
opt-level = 0

[profile.test.package]
"*".opt-level = 2
worth-query.opt-level = 0
worth-query-admission.opt-level = 0
worth-query-declaration.opt-level = 0
worth-query-execution.opt-level = 0
worth-query-host.opt-level = 0
worth-query-installation.opt-level = 0
worth-query-publication.opt-level = 0
worth-schema-graph.opt-level = 0

[profile.perf]
inherits = "dev"
opt-level = 2

# Publish-only WASM size profile for worth-signal-wasm (Track 6).
# Do not use for ordinary crate release builds; invoke via
# `wasm-pack build --profile release-wasm`.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
