[workspace]
resolver = "2"
# Road 1 sub-workspaces under workspaces own their own package membership.
# Keep them out of the root workspace so whole-world orchestration must route
# through explicit --manifest-path calls rather than silent root ownership.
exclude = ["workspaces/*"]
members = [
    "crates/worth-harness",


    "crates/worth-runtime-bridge",
    "crates/worth-server",
    "crates/worth-server-client-generation",
    "crates/worth-foundational",
    "crates/worth-proof",
    "crates/worth-signal",
    "crates/worth-signal-wasm",
    "crates/worth-relational",
    "crates/worth-runtime-world",
]

[workspace.metadata.worth_topology]
role = "thin_orchestrator"
road1_subworkspaces = ["workspaces/worth-contracts"]
forbidden_member_prefixes = ["workspaces/"]
boundary_check_manifest = "tools/boundary-check/Cargo.toml"
boundary_check_config = "tools/boundary-check/config/road1.toml"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "BUSL-1.1"

[workspace.dependencies]
worth-harness = { path = "crates/worth-harness", version = "0.1.0" }
worth-runtime-bridge = { path = "crates/worth-runtime-bridge" }
worth-server = { path = "crates/worth-server" }
worth-server-client-generation = { path = "crates/worth-server-client-generation" }
worth-query = { path = "workspaces/worth-query/crates/worth-query" }
worth-query-decl = { path = "workspaces/worth-query/crates/worth-query-decl" }
worth-query-host = { path = "workspaces/worth-query/crates/worth-query-host" }
worth-query-publication = { path = "workspaces/worth-query/crates/worth-query-publication" }
worth-query-replay = { path = "workspaces/worth-query/crates/worth-query-replay" }
worth-schema-graph = { path = "workspaces/worth-contracts/crates/worth-schema-graph" }
worth-foundational = { path = "crates/worth-foundational" }
worth-proof = { path = "crates/worth-proof" }
worth-signal = { path = "crates/worth-signal" }
worth-signal-wasm = { path = "crates/worth-signal-wasm" }
worth-relational = { path = "crates/worth-relational" }
worth-runtime-world = { path = "crates/worth-runtime-world" }

# Testing
trybuild = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

notify   = "8.2.0"
wgpu     = "24"
winit    = "0.30"
pollster = "0.3"
glam     = "0.29"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "=0.10.9"
indexmap = { version = "2", features = ["serde"] }
smallvec = "1"
rayon = "1"

# ---- Workspace-wide lint policy ----
# These apply to every crate that declares `lints.workspace = true`.
# Warnings fail the build automatically - no need to remember `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"
# Phase-carried counter proofs are incremented where work occurs; a single
# initializer would conceal the phase that incurred each cost.
field_reassign_with_default = "allow"
# Exported outcome vocabulary keeps domain qualifiers, and stable nested
# topology may repeat a semantic root when child responsibilities differ.
enum_variant_names = "allow"
module_inception = "allow"
# Domain `from_*` transitions may borrow the authority-bearing receiver; they
# are not collection-conversion conventions.
wrong_self_convention = "allow"

# ---- Profile tuning ----
# Dev/test builds: opt-level 0 for workspace crates (fast iteration),
# opt-level 2 for all dependencies (cached anyway, full speed).
# line-tables-only keeps backtraces useful while skipping most PDB generation.
# For perf-sensitive runs: cargo build/test --profile perf
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 2

[profile.perf]
inherits = "dev"
opt-level = 2

# Publish-only WASM size profile for worth-signal-wasm (Track 6).
# Do not use for ordinary crate release builds; invoke via
# `wasm-pack build --profile release-wasm`.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
