nextest-version = "0.9.140"

[profile.default]
default-filter = '(kind(lib) & not test(/(^|::)exhaustive::/)) | (kind(test) & test(/^fast::/))'
fail-fast = false
retries = 0
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "0s" }

[profile.integration]
default-filter = 'kind(test) & not test(/^(exhaustive|scale)::/)'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "0s" }

[profile.ci]
default-filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "0s" }

[test-groups.process-global]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/^serial::/)'
test-group = 'process-global'

# The durable original read checks cancellation at every source/artifact consult.
# Its complete sweep includes canonical source decoding and hashing; retain all
# injection points instead of applying the ordinary ten-minute termination.
[[profile.ci.overrides]]
filter = 'test(durable_idempotency_door_preserves_stops_at_every_consult)'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "0s" }
