nextest-version = "0.9.140"

[profile.default]
default-filter = '(kind(lib) & not test(/(^|::)exhaustive::/)) | (kind(test) & test(/^fast::/))'
fail-fast = false
retries = 0
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "0s" }

[profile.integration]
default-filter = 'kind(test) & not test(/^(exhaustive|scale)::/)'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "0s" }

[profile.ci]
default-filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "0s" }

# Compiler sessions share target/tests/trybuild. Its Windows cross-process
# lock can expire while a build is active; serialize sessions by cost path.
# Custom profiles inherit these default overrides.
[test-groups.trybuild-project]
max-threads = 1

[test-groups.process-global]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/^compile_fail::/)'
test-group = 'trybuild-project'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "0s" }

[[profile.default.overrides]]
filter = 'test(/^serial::/)'
test-group = 'process-global'
