nextest-version = "0.9.140"

[profile.default]
default-filter = 'kind(lib)'
fail-fast = false
retries = 0
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "0s" }

[profile.integration]
default-filter = 'kind(test)'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "0s" }

[profile.ci]
default-filter = 'all()'
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "0s" }

# trybuild builds every crate's cases in one shared project tree under
# target/tests/trybuild. Its cross-process lock does not hold on Windows (the
# heartbeat never advances the lock file's mtime, so it is busted after 1.5 s),
# and nextest runs each test in its own process: concurrent sessions overwrite
# each other's generated manifest. These tests therefore run one at a time; a
# queued test starts its slow-timeout only when it runs.
# scripts/ci/check_trybuild_test_group.py keeps this filter exact.
[test-groups.trybuild-project]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/::(assumption_freshness_readmission_and_downgrade_certification|bounded_request_is_a_sealed_external_contract|bridge_phase_boundaries_are_compile_time_private|bridge_public_contracts_a_to_f_are_sealed|bridge_public_contracts_g_to_r_are_sealed|bridge_public_contracts_s_to_z_are_sealed|bridge_truth_identity_string_facade_is_private|compile_fail_bundle_runner_rejects_empty_bundles|compile_fail_family_selection_fails_closed_for_unknown_family|compile_failures_protect_the_public_contract|conditional_source_authority_cannot_be_forged_or_admitted_separately|derive_accepts_bounded_values_and_rejects_unsupported_grammars|diagnostics_owned_policy_path_is_not_a_second_front_door|every_resident_field_requires_its_owner_contract|every_upfront_contract_door_is_compiler_enforced|external_caller_cannot_mint_release_proof_from_observations|external_code_cannot_construct_or_reuse_sealed_phase_artifacts_directly|fixed_arity_fork_join_boundaries_hold|fixed_arity_fork_join_representative_progression_compiles|fixed_shape_and_proven_collection_boundaries_hold|foundational_compile_time_boundaries_hold|frontier_route_receipt_compile_fail_boundaries_hold|host_computed_compile_fail_boundaries_hold|invalidation_authority_forms_are_not_publicly_mintable|invariant_ui_boundaries_are_sealed|lineage_phase_boundaries_are_compile_time_private|lowering_and_execution_readiness_boundary_certification|merge_api_compile_fail_boundaries_hold|merge_phase_boundaries_are_compile_time_private|owner_services_public_facade_and_negative_fences_are_current|phase_boundaries_hold|phase_six_old_frontier_api_is_removed|phase_six_predicted_counters_cannot_satisfy_performed_receipt_api|phase_six_public_invalidation_observation_surface_is_current|phase_two_invalidation_progression_remains_private|pleasant_entrypoints_remain_additive_guidance|pleasant_lane_dx_certification|pleasant_scoped_defaults_do_not_hide_missing_progression|prepared_candidate_boundaries_are_compile_time_private|public_authority_bounda