SPECIFICATION Spec

CONSTANTS
    Scopes = {"Project1", "Project2"}
    Principals = {"Alice", "Bob"}
    MaxVersion = 1
    MaxIncarnation = 2

INVARIANTS
    TypeOK
    NeverLeakUngrantedScope
    NeverServeAfterRevoke
    GrantsDurableAcrossReopen
    NoConcurrentWriters

PROPERTIES
    NeverServeAfterRevokeProp
    NeverServeUnauthenticatedProp
    NoMutationWhileClosedProp
    CollaboratorEventuallyObservesProject1Write
    WatchEventuallyDeliversProject1Write
