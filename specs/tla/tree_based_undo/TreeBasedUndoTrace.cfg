SPECIFICATION TraceSpec

CONSTANTS
    Entities = {"e1", "e2"}
    Values = {1, 2}
    Keys = {"k1", "k2", "k3", "k4", "k5", "k6", "k7", "k8",
            "k9", "k10", "k11", "k12", "k13", "k14", "k15", "k16"}
    MaxNodes = 17
    MaxStops = 16
    FactBug = FALSE
    WedgeBug = FALSE

INVARIANTS
    TypeOK
    SnapshotExactness
    OwnershipAndOutputsConsistent
    TreeStructureValid
    IdempotencyValid
    GenerationalCustody
    StoppedCustody
    NoWedge
    FactsFollowLine
    FactsAgreeWithSnapshots

PROPERTIES
    TraceAccepted
