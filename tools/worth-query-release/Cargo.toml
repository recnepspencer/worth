[package]
name = "worth-query-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
worth-query-installation = { path = "../../workspaces/worth-query/crates/worth-query-installation" }
worth-query-package-archive = { path = "../../workspaces/worth-query/crates/worth-query-package-archive" }

[dev-dependencies]
serde_yaml_ng = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"
enum_variant_names = "allow"
wrong_self_convention = "allow"
