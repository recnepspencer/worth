root_manifest = "Cargo.toml"
forbidden_root_prefixes = ["cad/workspaces/"]

[machine_authority]
canonical_config = "tools/boundary-check/config/road1.toml"
mirrored_docs = ["plans/worthy/NAMING.md"]


[naming]
bands = ["schema", "dsl", "entry", "resolver", "solver", "derived", "pack", "app", "ui", "cert"]

[[naming.reserved_domains]]
tier = "worth"
band = "schema"
domains = ["core"]

[[naming.reserved_domains]]
tier = "worth"
band = "pack"
domains = ["registry"]

[rule_contracts]
[rule_contracts.query_audience]
engine_package = "worth-query"

[[rule_contracts.query_audience.audiences]]
package = "worth-query-decl"
label = "declaration"
allowed_bands = ["entry", "cert"]
guidance = "declaration artifacts and handles"

[[rule_contracts.query_audience.audiences]]
package = "worth-query-host"
label = "host"
allowed_bands = ["entry", "cert"]
guidance = "admission, lowering, and execution"

[[rule_contracts.query_audience.audiences]]
package = "worth-query-replay"
label = "replay"
allowed_bands = ["cert"]
guidance = "cert-only reconstruction and replay"

[[rule_contracts.replay_surfaces]]
label = "certification replay"
package_prefixes = ["worthy-cert-replay"]
cert_domains = ["replay", "reconstruction"]

[[rule_contracts.band_rules]]
source_band = "schema"
allowed_target_bands = []

[[rule_contracts.band_rules]]
source_band = "pack"
allowed_target_bands = ["schema"]

[[born_crates]]
path = "cad/workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"

[[born_crates]]
path = "cad/workspaces/worth-packs/crates/worth-pack-registry"
package = "worth-pack-registry"

[[seed_skeletons]]
path = "cad/workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/lib.rs",
]

[[seed_skeletons]]
path = "cad/workspaces/worth-packs/crates/worth-pack-registry"
package = "worth-pack-registry"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/lib.rs",
]

[[subworkspaces]]
path = "cad/workspaces/worth-contracts"
allowed_crate_prefixes = ["worth-schema-"]
member_lane = "crates/*"

[[subworkspaces]]
path = "cad/workspaces/worth-packs"
allowed_crate_prefixes = ["worth-pack-"]
member_lane = "crates/*"


[legacy_reference_ratchet]
governed_roots = []
forbidden_fragments = []
snapshot = "tools/boundary-check/snapshots/legacy-references.toml"
exclude_paths = []
replacement_guidance = "Use the corresponding worth_/worth- spelling instead of the retired name."
