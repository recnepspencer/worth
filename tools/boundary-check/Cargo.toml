[package]
name = "boundary-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
serde = "1"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
[profile.dev]
debug = 0
[profile.dev.package.boundary-check]
opt-level = 1
[profile.test]
debug = 0
