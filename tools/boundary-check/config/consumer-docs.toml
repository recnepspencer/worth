# Exact consumer inventory. Doctest roots also drive query_gate.py doc.
documents = [
  "docs/build-an-application.md",
  "docs/how-it-works.md",
  "docs/api.md",
  "docs/capability-index.md",
  "workspaces/worth-query/README.md",
  "workspaces/worth-query/crates/worth-query-host/README.md",
  "workspaces/worth-query/crates/worth-query/docs/AI_README.md",
  "workspaces/worth-query/crates/worth-query/docs/foundations/programs-and-adoption.md",
  "workspaces/worth-query/crates/worth-query/docs/execution/application-aftermath-and-recovery.md",
  "workspaces/worth-query/crates/worth-query/docs/domain-capabilities/workflow/README.md",
  "workspaces/worth-query/crates/worth-query/docs/domain-capabilities/execution-resource-admission-and-managed-runs.md",
  "workspaces/worth-query/crates/worth-query/docs/foundations/ordinary-application-front-door.md",
  "workspaces/worth-query/crates/worth-query/docs/foundations/workflows.md",
]

[[doctests]]
manifest = "workspaces/worth-query/Cargo.toml"
packages = ["worth-query-host", "worth-query-decl", "worth-query", "worth-query-publication", "worth-query-execution", "worth-query-installation"]

[[doctests]]
manifest = "workspaces/worth-query-bank-world/Cargo.toml"
packages = ["bank-estate-certification"]

[[compiled_sources]]
name = "owning_fixed.rs"
crate_root = "workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/consumer_root"
target = "src/main.rs"
source = "src/application_invariant_acceptance/proof/application_program/fixed_action_instances.rs"

[[compiled_sources]]
name = "owning_discovered.rs"
crate_root = "workspaces/worth-query/crates/worth-query-certification/fixtures/consumer_entry/consumer_root"
target = "src/main.rs"
source = "src/application_invariant_acceptance/proof/application_program/discovered.rs"

[[compiled_sources]]
name = "owning_source_only.rs"
crate_root = "workspaces/worth-query/crates/worth-query-certification"
target = "examples/ordinary_product_workflow.rs"
source = "examples/ordinary_product_workflow.rs"

[[compiled_sources]]
name = "owning_workflow.rs"
crate_root = "workspaces/worth-query/crates/worth-query-certification"
target = "examples/authored_workflow/main.rs"
source = "examples/authored_workflow/main.rs"
