package = "worth-schema-core"

[[born_crates]]
path = "workspaces/worth-contracts/crates/worth-schema-graph"
package = "worth-schema-graph"

[[seed_skeletons]]
path = "workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/identity.rs",
  "src/identity_name.rs",
  "src/lib.rs",
  "src/naming.rs",
  "src/tolerance.rs",
  "src/units.rs",
]

[[seed_skeletons]]
path = "workspaces/worth-contracts/crates/worth-schema-graph"
package = "worth-schema-graph"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/lib.rs",
  "src/promotion.rs",
]

[[subworkspaces]]
path = "workspaces/worth-contracts"
allowed_crate_prefixes = ["worth-schema-"]
member_lane = "crates/*"

[legacy_reference_ratchet]
governed_roots = [
  "workspaces/worth-contracts/",
  "tools/",
  "crates/worth-proof/",
]
forbidden_fragments = ["forge_", "forge-"]
snapshot = "tools/boundary-check/snapshots/legacy-references.toml"
exclude_paths = [
  "tools/boundary-check/config/road1.toml",
  "tools/boundary-check/snapshots/legacy-references.toml",
]
replacement_guidance = "Use the corresponding worth_/worth- spelling instead of the retired forge_/forge- name."

# Law substrates are legal outside the band grammar. worth-proof is the only
# blessed compile-time law substrate and is legal in every tier and band.
[[law_substrates]]
package = "worth-proof"
tiers = ["worth", "worthy"]
bands = [
  "schema",
  "dsl",
  "entry",
  "resolver",
  "solver",
  "derived",
  "pack",
  "app",
  "ui",
  "cert",
]
