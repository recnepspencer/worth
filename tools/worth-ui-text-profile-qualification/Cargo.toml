[package]
name = "worth-ui-text-profile-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
harfrust = { version = "=0.12.0", default-features = false, features = ["std"] }
icu_segmenter = { version = "=2.2.0", default-features = false, features = ["compiled_data", "auto"] }
read-fonts = { version = "=0.41.0", default-features = false, features = ["std", "experimental_traverse"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }
linesweeper = { version = "=0.4.0", default-features = false }
png = { version = "=0.18.1", default-features = false }
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["std"] }
unicode-segmentation = { version = "=1.13.3", default-features = false }

[lints.rust]
unsafe_code = "forbid"
