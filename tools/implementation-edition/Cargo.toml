[package]
name = "implementation-edition"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
flate2 = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tar = "0.4"
toml = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

# Compiler/sysroot content is large. Optimize the digest kernel while retaining
# normal incremental settings for this tool and the observed consumer.
[profile.dev.package.sha2]
opt-level = 3
