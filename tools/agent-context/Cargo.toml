[package]
name = "agent-context"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full"] }
toml = "1"

# These tools run on every edit; retain debug assertions while optimizing them.
[profile.dev]
opt-level = 3
debug-assertions = true
