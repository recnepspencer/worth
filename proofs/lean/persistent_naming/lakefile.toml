name = "persistent_naming"
version = "0.1.0"
defaultTargets = ["PersistentNaming"]

[[lean_lib]]
name = "PersistentNaming"

# Rust <-> model conformance: `lake exe conformance <trace.ndjson>...` checks
# the traces emitted with `WORTH_PERSISTENT_NAMING_TRACE_DIR=<dir>` by
# worth-relational-lineage's `mint_order::conformance_trace`,
# `index::name_index_conformance_trace`,
# `name_indexes::fork_children_conformance_trace` and
# `cow_map::fork_conformance_trace` tests and worth-query-declaration's
# `wire_bound_conformance_trace` test against the proved model.
[[lean_exe]]
name = "conformance"
root = "Conformance"
