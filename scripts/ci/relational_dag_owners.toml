# Arrows in allowed follow caller to dependency. The reverse Branch directions
# and both Mutation directions are ratcheted. Ordinary checkpoint cannot reach
# reconstruction, including when an import is routed through a re-export.
[[boundaries]]
owner = "branch"
allowed = [["root_custody", "envelope"], ["root_custody", "projection_view"], ["envelope", "projection_view"]]
[boundaries.paths]
root_custody = ["branch", "runtime/state/subsystems/owned_state"]
envelope = ["branch/envelope", "history/data/canonical_commit_envelope", "history/commit", "publication/patch"]
projection_view = ["branch/projection_view", "visibility", "snapshots", "query", "runtime/state/subsystems/visibility"]

[[boundaries]]
owner = "mutation"
allowed = []
[boundaries.paths]
authorization_and_derivation = ["authorization", "derived_relation"]
candidate_source = ["validation/candidate_source"]

[[boundaries]]
owner = "durability"
allowed = [["reconstruction", "ordinary_checkpoint"]]
[boundaries.paths]
ordinary_checkpoint = ["durability/ordinary_checkpoint", "durability/checkpoints", "durability/checkpoint_history", "durability/checkpoint_admission", "durability/authority/checkpoint_capture", "durability/authority/checkpoint_complete", "durability/authority/checkpoint_components", "durability/authority/checkpointing", "durability/authority/checkpoint_native_capture"]
reconstruction = ["durability/reconstruction", "durability/recovery", "replay", "durability/authority/recovery", "durability/authority/runtime_rebuild"]
