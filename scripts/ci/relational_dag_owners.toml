# Virtual owners under crates/worth-relational/src.
# Longest path wins. A module prefix matches both name.rs and name/.
# Stage 2 splits mixed source in place. Court seeds carry no production crate.
court_seed = "courts"

[owners.contracts]
crate = "worth-relational-contracts"
layer = 0
cap = 68000
floor = 38300
depends = []

[owners.storage]
crate = "worth-relational-storage"
layer = 1
cap = 58000
floor = 25400
depends = ["contracts"]

[owners.branch]
crate = "worth-relational-branch"
layer = 2
cap = 98000
floor = 56400
depends = ["contracts", "storage"]

[owners.lineage]
crate = "worth-relational-lineage"
layer = 3
cap = 17000
floor = 7100
depends = ["contracts", "storage", "branch"]

[owners.mutation]
crate = "worth-relational-mutation"
layer = 3
cap = 98000
floor = 51000
depends = ["contracts", "storage", "branch"]

[owners.merge]
crate = "worth-relational-merge"
layer = 3
cap = 24000
floor = 9900
depends = ["contracts", "storage", "branch"]

[owners.indexes]
crate = "worth-relational-indexes"
layer = 3
cap = 27000
floor = 13000
depends = ["contracts", "storage", "branch"]

[owners.durability]
crate = "worth-relational-durability"
layer = 4
cap = 84000
floor = 45400
depends = ["contracts", "storage", "branch", "lineage", "mutation", "merge", "indexes"]

[owners.publication]
crate = "worth-relational-publication"
layer = 5
cap = 60000
floor = 26600
depends = ["contracts", "storage", "branch", "lineage", "mutation", "merge", "indexes", "durability"]

[owners.runtime]
crate = "worth-relational"
layer = 6
cap = 78000
floor = 32000
depends = ["contracts", "storage", "branch", "lineage", "mutation", "merge", "indexes", "durability", "publication"]

