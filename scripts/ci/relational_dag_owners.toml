# Extracted packages and the Runtime and court sources under crates/worth-relational/src.
# Longest path wins. A module prefix matches both name.rs and name/.
# Physical owners cover every source below their crate roots, including new
# branch projection reads, contracts reports/time, and publication pin methods.
# Court seeds are counted separately from production owners.
court_seed = "courts"

[owners.contracts]
physical = true
crate = "worth-relational-contracts"
layer = 0
# +100 for the typed later-stage retirement refusal (public #348).
# +400 for allocation-free borrowed created-binding lookups (M3 C5.4).
# +100 for the declarative ResidencyBudget config section (Store M4.2b).
# +100 for Persistent Naming Phase 7B-2a structural_identity, Store M4.3f finalization artifact field, and public #446 shared-byte symbol custody.
# +300 for public #455 canonical kept-group member deltas and the group state view.
cap = 69000
floor = 38300
depends = []

[owners.storage]
physical = true
crate = "worth-relational-storage"
layer = 1
cap = 58000
floor = 25400
depends = ["contracts"]

[owners.branch]
physical = true
crate = "worth-relational-branch"
layer = 2
cap = 98000
floor = 56400
depends = ["contracts", "storage"]

[owners.lineage]
physical = true
crate = "worth-relational-lineage"
layer = 3
# +3000 for Store M4.3f (P0-A) CHK24 paged persistent-naming/group store,
# chunked continuation rows, tiered COW overlays, capability-gated rebuilds,
# cold retained-fork slicing, commit preflight, and retention compaction.
# +1000 for Store M4.3f Round 2 hardening (structural persistent CowMap AVL
# tree, shared continuation-envelope validation, and Round 2 tests).
# +500 for Store M4.3f Round 3 hardening (earliest commit headers, O(1) cold
# fork base link + ACK rebind, Arc-wrapped CowMap values, and Round 3 tests).
# +200 for Store M4.3f Round 6-7 hardening (deadlock-free ACK guard, bounded
# GROUP_LOG branch digest keys, and VALUE_CHUNK continuation accounting).
# +900 for Store M4.3f Round 11-13 hardening (per-branch O(log P) ephemeral
# event-page & GROUP_LOG window indexes, AVL path-sharing detection, Arc-shared
# forward edges, safe range-based OrdMap predecessor lookups, and zero-rebuild compaction).
# +1000 for public #455 delta group state (header and per-member rows, ordered
# member seeks, delta verification/installation, WPGL v2 kept deltas, tests).
# +300 for its contiguous group-member page domain and the Rust -> Lean
# conformance trace test.
# +400 for the persistent-naming Rust -> Lean conformance trace tests (mint
# order, name-index ingestion and resolution), which read crate-private state.
# +200 for the fork_children and CowMap fork conformance traces, which call
# the private `forks_inheriting` and read private `CowMap` nodes.
# +300 for projected group keys, ordered page encoding, and incident group history.
# +1400 for public #480 O(names + fork deltas) CHK24 sealing: CowMap
# structural-sharing diff (`cow_map_diff.rs`), delta-base tombstone chain
# resolution (`store_delta.rs`), fork-forest delta sealer (`naming_capture_delta.rs`),
# and the `cow_diff` Rust -> Lean conformance trace.
# +1100 for public #480 hardening: prefix-scoped multi-scheme group capture,
# zero-encode diff cardinality counting, skip-ancestor deep-chain resets,
# incremental cold-preserving historical fork truncation (`truncate.rs`,
# `group_diff.rs`, `naming_capture_diff.rs`), and direct cold-chain conformance.
# +500 for public #480 fork-forest O(1) Euler-tour anchor tracking, deleted-branch
# roster filtering, retention-floor alias guard, zero-alloc CowMap diff stats,
# and Arc NodeId Lean conformance trace split (`naming_capture_forest.rs`,
# `cow_map_cold_chain_conformance_trace.rs`).
# +300 for public #480 retired-intermediate fork ancestry (`retired_forks`),
# separate retired sibling grouping, alias-header compatibility guard, and
# warm historical fork lineage event header bounds.
# +300 for public #480 post-reopen composed delta carry (`naming_capture_carry.rs`),
# linear O(V+E) fork-forest / retired-chain validation, and per-branch event commit bounds.
# +150 for public #480 representative-leaf peer carry over shared retired C1 intermediates.
cap = 28200
floor = 7100
depends = ["contracts", "storage", "branch"]

[owners.mutation]
physical = true
crate = "worth-relational-mutation"
layer = 3
cap = 98000
floor = 51000
depends = ["contracts", "storage", "branch"]

[owners.indexes]
physical = true
crate = "worth-relational-indexes"
layer = 3
cap = 27000
floor = 13000
depends = ["contracts", "storage", "branch"]

[owners.durability]
physical = true
crate = "worth-relational-durability"
layer = 4
cap = 84000
floor = 45400
depends = ["contracts", "storage", "branch", "lineage", "mutation", "indexes"]

[owners.publication]
physical = true
crate = "worth-relational-publication"
layer = 5
cap = 60000
floor = 26600
depends = ["contracts", "storage", "branch", "lineage", "mutation", "indexes", "durability"]

[owners.runtime]
crate = "worth-relational"
layer = 6
# +1000 for PR 4C Native staged cold-preflight and transition backfill support.
# +500 for #119 coupled successor supersession (retraction and completion on
# the candidate), which fit before #389's concurrent runtime growth.
# +300 for Persistent Naming (#421) and Store M4.3b paged identity close retirement.
# +200 for Store M4.3f Round 3 fork-vs-retention-floor coordination and detached fork cold-source rebind.
cap = 80000
floor = 32000
depends = ["contracts", "storage", "branch", "lineage", "mutation", "indexes", "durability", "publication"]

