# Environment Isolation (Doctrine D8)
#
# These flags ensure deterministic builds:
# - overflow-checks: catch integer overflow (panic instead of wrapping)
#
# Note: target-cpu is omitted for Apple Silicon compatibility.
# The blueprint specifies x86-64-v3, but we're on aarch64.
# unsafe_code is forbidden per-crate via #![forbid(unsafe_code)] in lib.rs.

[build]
rustflags = [
    "-C", "overflow-checks=on",
    # WORTH UI selects its Linux windowing system at compile time. The arms and
    # their exhaustiveness guard are nested under cfg(target_os = "linux"), so
    # carrying this on every target is inert off Linux. It lives in [build]
    # rather than a [target.*] block because those REPLACE [build].rustflags
    # rather than merging, which would silently drop overflow-checks.
    "--cfg", "worth_ui_windowing=\"wayland\"",
    # The adapter class the selected profile admits. "software" exists only for
    # the X11 certification lane, whose X server (Xvfb) has no DRI3 and so
    # offers hardware adapters no surface formats; products build "hardware".
    "--cfg", "worth_ui_adapter=\"hardware\"",
]

# Trace output verbosity (force = false → your override wins):
#   RUST_LOG=info   cargo test   → display_interesting() summary (default)
#   RUST_LOG=debug  cargo test   → every decision, line by line
#   RUST_LOG=off    cargo test   → silent (CI-friendly)
[env]
RUST_LOG = { value = "info", force = false }
RUST_MIN_STACK = { value = "16777216", force = false }
