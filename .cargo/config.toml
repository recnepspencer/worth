# Environment Isolation (Doctrine D8)
#
# These flags ensure deterministic builds:
# - overflow-checks: catch integer overflow (panic instead of wrapping)
#
# Note: target-cpu is omitted for Apple Silicon compatibility.
# The blueprint specifies x86-64-v3, but we're on aarch64.
# unsafe_code is forbidden per-crate via #![forbid(unsafe_code)] in lib.rs.

[build]
incremental = true
rustflags = [
    "-C", "overflow-checks=on",
    # Native code and compiler courts share one artifact graph. Keep full type
    # diagnostics here, rather than appending a court-only flag that recompiles
    # shared units (and avoid unstable .long-type-* diagnostic file paths).
    "--verbose",
]

# Relocate executable metadata away from the arm64 dyld shared-cache slide
# range, then validate every mapped segment before publication (#67). Choosing a
# linker preserves all [build].rustflags; target.rustflags would replace them.
[target.aarch64-apple-darwin]
linker = "scripts/macos_linker"

# Keep the compiler's safety flags above when choosing LLVM's linker.
# The wrapper forwards to rust-lld unchanged and raises every PDB's page size,
# so a large test binary's debug information can exceed 4 GiB.
[target.x86_64-pc-windows-msvc]
linker = "scripts/windows_linker.cmd"

[alias]
inner = "nextest run --lib --no-fail-fast --locked"
integration = "nextest run --profile integration --no-fail-fast --locked"
verify = "nextest run --profile ci --no-fail-fast --locked"

# Trace output verbosity (force = false → your override wins):
#   RUST_LOG=info   cargo test   → display_interesting() summary (default)
#   RUST_LOG=debug  cargo test   → every decision, line by line
#   RUST_LOG=off    cargo test   → silent (CI-friendly)
[env]
RUST_LOG = { value = "info", force = false }
RUST_MIN_STACK = { value = "67108864", force = false }
