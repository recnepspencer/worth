[package]
name = "worth-signal"
edition.workspace = true
version.workspace = true
description = "Generic deterministic reactive computation runtime"
readme = "README.md"
repository = "https://github.com/recnepspencer/WORTH"
publish = false
keywords = ["incremental", "runtime", "reactive", "diagnostics", "replay"]
categories = ["data-structures", "caching", "science"]

[features]
default = ["profile-extended"]
parallel = []
profile-compact = []
profile-standard = []
profile-extended = []
test-operation-control = []
test-peak-allocation = []

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1", features = ["serde"] }
rayon = "1"
serde_json = "1"
worth-proof = { path = "../worth-proof" }
worth-foundational = { path = "../worth-foundational" }
sha2 = "0.10"
im = { version = "15.1", features = ["serde"] }
arc-swap = "1"

[dev-dependencies]
worth-harness.workspace = true
serde_json = { version = "1", features = ["arbitrary_precision"] }
stats_alloc = "0.1"
tracking-allocator = { version = "0.4", default-features = false }
trybuild = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

# The documented owner workflow is evidence, not decoration: `cargo test` must
# run it, not merely build it. `harness = false` keeps `fn main` the single
# entry point, so what the test lane executes is byte-identical to what
# `cargo run --example branch_bases` shows a developer. The target runs whole
# or not at all; a libtest filter passed after `--` does not select within it.
[[example]]
name = "branch_bases"
test = true
harness = false

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
[lints]
workspace = true
