[package]
name = "worth-signal"
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Generic deterministic reactive computation runtime"
readme = "README.md"
repository = "https://github.com/recnepspencer/WORTH"
publish = false
keywords = ["incremental", "runtime", "reactive", "diagnostics", "replay"]
categories = ["data-structures", "caching", "science"]

[features]
default = ["profile-extended"]
profile-compact = []
profile-standard = []
profile-extended = []
test-peak-allocation = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1", features = ["serde"] }
serde_json = "1"
worth-proof = { path = "../worth-proof" }
worth-foundational = { path = "../worth-foundational" }
worth-execution = { path = "../worth-execution" }
sha2 = "0.10"
# Retained-storage charges describe im 15.1 nodes; ordered_index courts drift.
im = { version = "=15.1.0", features = ["serde"] }
arc-swap = "1"

[dev-dependencies]
worth-harness.workspace = true
serde_json = { version = "1", features = ["arbitrary_precision"] }
stats_alloc = "0.1"
tracking-allocator = { version = "0.4", default-features = false }
trybuild = "1"

# The documented owner workflow is evidence, not decoration: the test lane must
# run it, not merely build it. The signal_contracts suite compiles this same
# file as a module and calls its `main`, so what the test lane executes is
# byte-identical to what `cargo run --example branch_bases` shows a developer.
# The example itself is not a test target: a `harness = false` binary cannot
# answer nextest's test listing, which made `cargo verify --workspace` refuse
# the whole root.
[[example]]
name = "branch_bases"
test = false

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
[lints]
workspace = true

[[test]]
name = "signal_contracts"
path = "tests/signal_contracts.rs"

[[test]]
name = "candidate_ticket_contention"
path = "tests/isolated/candidate_ticket_contention.rs"

[[test]]
name = "request_differential"
path = "tests/isolated/request_differential.rs"
