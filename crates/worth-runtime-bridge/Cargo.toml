[package]
name = "worth-runtime-bridge"
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Bridge facade and routing boundary between worth-relational and worth-signal."
repository = "https://github.com/recnepspencer/WORTH"
keywords = ["bridge", "runtime", "invalidation", "snapshot", "facade"]
categories = ["data-structures", "science"]

[dependencies]
worth-foundational = { path = "../worth-foundational" }
worth-execution = { path = "../worth-execution" }
worth-proof = { path = "../worth-proof" }
worth-relational = { path = "../worth-relational" }
worth-signal = { path = "../worth-signal" }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
worth-harness = { path = "../worth-harness" }
serde = { version = "1", features = ["derive"] }
trybuild.workspace = true

[lints]
workspace = true

[[test]]
name = "bridge_contracts"
path = "tests/bridge_contracts.rs"
