[package]
"name" = "worth-runtime-bridge"
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"version" = { "workspace" = true }
"license" = { "workspace" = true }
"description" = "Bridge facade and routing boundary between worth-relational and worth-signal."
