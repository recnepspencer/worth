worth-relational = { path = "../worth-relational" }
worth-signal = { path = "../worth-signal" }
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "0.10"
[dev-dependencies]
"worth-harness" = { "path" = "../worth-harness" }


