[package]
name = "worth-relational"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A standalone truth runtime for transactional, inspectable, replayable graph state."
readme = "README.md"
repository = "https://github.com/recnepspencer/WORTH"
keywords = ["graph", "runtime", "transactions", "replay", "simulation"]
categories = ["data-structures", "database-implementations", "science"]

[features]
allocation-probes = []
test-durability-faults = []
test-operation-control = ["test-durability-faults"]

[dependencies]
worth-foundational = { path = "../worth-foundational" }
worth-proof = { path = "../worth-proof" }
worth-runtime-bridge = { path = "../worth-runtime-bridge" }
serde = { version = "1", features = ["derive", "rc"] }
rmp-serde = "1.3"
rayon = "1"
smallvec = "1"
sha2 = "0.10"
dashmap = "6"
crossbeam-queue = "0.3"
arc-swap = "1"

[dev-dependencies]
worth-harness.workspace = true
proptest = "1"
stats_alloc = "0.1"
trybuild = "1"

[lints]
workspace = true

# Declared so `cargo test` executes this example's own `main` as an ordinary
# part of the existing workspace test lane. dx_laws #18: a public example is a
# compatibility contract, so it must run against the real facade rather than
# only compile. `harness = false` runs `main` instead of an empty libtest
# harness. No separate `cargo run` evidence lane exists or is wanted.
[[example]]
name = "branch_local_mvcc"
test = true
harness = false
