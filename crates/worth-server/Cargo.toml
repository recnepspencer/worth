[package]
name = "worth-server"
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Typed server facade and transport boundary for Worth."
repository = "https://github.com/recnepspencer/Worth"
keywords = ["server", "facade", "axum", "typed"]
categories = ["network-programming", "web-programming"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }
worth-foundational.workspace = true
worth-proof.workspace = true
worth-execution.workspace = true
worth-query.workspace = true
worth-query-host = { path = "../../workspaces/worth-query/crates/worth-query-host" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
flate2 = "1"

[dev-dependencies]
worth-query-host = { path = "../../workspaces/worth-query/crates/worth-query-host" }
worth-runtime-bridge.workspace = true
worth-relational.workspace = true
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
trybuild.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "server_contracts"
path = "tests/server_contracts.rs"

[[test]]
name = "product_operation_phase_thirteen_shared_read"
path = "tests/isolated/product_operation_phase_thirteen_shared_read.rs"

[[test]]
name = "product_read_nested_lease"
path = "tests/isolated/product_read_nested_lease.rs"
