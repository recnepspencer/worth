[package]
"name" = "worth-server"
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"version" = { "workspace" = true }
"license" = { "workspace" = true }
"description" = "Typed server facade and transport boundary for Worth."
"repository" = "https://github.com/recnepspencer/Worth"
"keywords" = ["server", "facade", "axum", "typed"]
"categories" = ["network-programming", "web-programming"]
"autotests" = false


[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }
worth-foundational.workspace = true
worth-proof.workspace = true
worth-execution.workspace = true
worth-query.workspace = true
worth-query-host = { path = "../../workspaces/worth-query/crates/worth-query-host" }
serde.workspace = true
serde_json.workspace = true
schemars = "1.0.4"
sha2 = "0.10"
getrandom = "0.4.3"
flate2 = "1"
[dev-dependencies]
"worth-query-host" = { "path" = "../../workspaces/worth-query/crates/worth-query-host" }
"sha2" = "0.10"
"tokio" = { "version" = "1", "features" = ["macros", "rt-multi-thread"] }


[lints]
workspace = true
