[workspace]
resolver = "2"
members = [
    "apps/platform-pulse",
    "crates/worth-ui-dsl",
    "crates/worth-ui-runtime",
    "crates/worth-ui-inspection",
    "crates/worth-ui-query-binding",
    "crates/worth-ui-host-contract",
    "crates/worth-ui-text",
    "crates/worth-ui-host-native",
    "crates/worth-ui-host-headless",
    "crates/worth-ui-retained-order",
    "crates/worth-ui-native-platform",
    "crates/worth-ui-certification",
    "crates/worth-ui-test-support",
    "crates/worth-ui",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "BUSL-1.1"

[workspace.dependencies]
worth-foundational = { path = "../../crates/worth-foundational" }
worth-proof = { path = "../../crates/worth-proof" }
worth-query = { path = "../worth-query/crates/worth-query" }
worth-query-decl = { path = "../worth-query/crates/worth-query-decl" }
worth-query-host = { path = "../worth-query/crates/worth-query-host" }
worth-relational = { path = "../../crates/worth-relational" }
worth-runtime-bridge = { path = "../../crates/worth-runtime-bridge" }
worth-signal = { path = "../../crates/worth-signal" }

worth-ui-dsl = { path = "crates/worth-ui-dsl" }
worth-ui-runtime = { path = "crates/worth-ui-runtime" }
worth-ui-inspection = { path = "crates/worth-ui-inspection" }
worth-ui-query-binding = { path = "crates/worth-ui-query-binding" }
worth-ui-host-contract = { path = "crates/worth-ui-host-contract" }
worth-ui-text = { path = "crates/worth-ui-text" }
worth-ui-host-native = { path = "crates/worth-ui-host-native" }
worth-ui-host-headless = { path = "crates/worth-ui-host-headless" }
worth-ui-retained-order = { path = "crates/worth-ui-retained-order" }
worth-ui-native-platform = { path = "crates/worth-ui-native-platform" }
worth-ui-certification = { path = "crates/worth-ui-certification" }
worth-ui-test-support = { path = "crates/worth-ui-test-support" }
worth-ui = { path = "crates/worth-ui" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
notify = "8.2.0"
uiautomation = { version = "=0.25.0", default-features = false, features = ["control", "input", "screenshot"] }
winsafe = { version = "=0.0.28", default-features = false }
windows = { version = "=0.61.3", default-features = false }
xcap = { version = "=0.9.7", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
pollster = "=0.4.0"
harfrust = { version = "=0.12.0", default-features = false, features = ["std"] }
read-fonts = { version = "=0.41.0", default-features = false, features = ["std", "experimental_traverse"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }
linesweeper = { version = "=0.4.0", default-features = false }
png = { version = "=0.18.1", default-features = false }
icu_segmenter = { version = "=2.2.0", default-features = false, features = ["compiled_data", "auto"] }
rustybuzz = "=0.20.1"
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["std"] }
unicode-segmentation = { version = "=1.13.3", default-features = false }
sha2 = "=0.10.9"
win32job = "=2.0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Worth UI is a nested workspace and does not inherit the root workspace's
# profiles. Keep Windows test/debug metadata useful without paying for full PDB
# generation in every semantic test suite and compile-contract fixture.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
