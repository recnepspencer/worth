[package]
name = "worth-ui-certification"
edition.workspace = true
version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "worth_ui_certification"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde_json = "1.0"
csv = "1.3"
sha2.workspace = true
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"
worth-ui = { path = "../worth-ui", features = ["certification-support"] }
worth-ui-dsl = { path = "../worth-ui-dsl" }
worth-ui-host-contract = { path = "../worth-ui-host-contract" }
worth-ui-host-headless = { path = "../worth-ui-host-headless" }
worth-ui-host-native = { path = "../worth-ui-host-native", features = ["certification-support"] }
worth-ui-native-platform = { path = "../worth-ui-native-platform", features = ["certification-support"] }
worth-ui-query-binding = { path = "../worth-ui-query-binding", features = ["certification-construction"] }
worth-ui-runtime = { path = "../worth-ui-runtime", features = ["certification-support"] }
worth-ui-test-support = { path = "../worth-ui-test-support" }
worth-ui-text = { path = "../worth-ui-text" }
worth-query-host = { path = "../../../worth-query/crates/worth-query-host" }

[dev-dependencies]
allocation-counter = "0.8.1"
atomicwrites = "0.4.4"
winit = { workspace = true }
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-query = { path = "../../../worth-query/crates/worth-query" }
worth-query-certification = { path = "../../../worth-query/crates/worth-query-certification" }
worth-runtime-bridge = { workspace = true, features = ["certification-construction"] }
worth-signal.workspace = true
worth-ui-inspection = { path = "../worth-ui-inspection" }
worth-ui-platform-pulse = { path = "../../apps/platform-pulse" }

[[test]]
name = "application_contracts"
path = "tests/suites/application_contracts.rs"

[[test]]
name = "declaration_contracts"
path = "tests/suites/declaration_contracts.rs"

[[test]]
name = "graph_contracts"
path = "tests/suites/graph_contracts.rs"

[[test]]
name = "inspection_contracts"
path = "tests/suites/inspection_contracts.rs"

[[test]]
name = "measurement_contracts"
path = "tests/suites/measurement_contracts.rs"

[[test]]
name = "obligation_contracts"
path = "tests/suites/obligation_contracts.rs"

[[test]]
name = "topology_contracts"
path = "tests/suites/topology_contracts.rs"
