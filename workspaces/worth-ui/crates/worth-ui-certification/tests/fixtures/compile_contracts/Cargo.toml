worth-ui-host-headless = { path = "../../../../worth-ui-host-headless" }
worth-ui-native-platform = { path = "../../../../worth-ui-native-platform" }
worth-ui-inspection = { path = "../../../../worth-ui-inspection" }
worth-ui-query-binding = { path = "../../../../worth-ui-query-binding", features = ["certification-construction"] }
worth-ui-runtime = { path = "../../../../worth-ui-runtime", features = ["certification-support"] }
worth-ui-test-support = { path = "../../../../worth-ui-test-support" }
serde.workspace = true

