[package]
name = "worth-ui"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[lib]
name = "worth_ui"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
certification-support = ["worth-ui-runtime/certification-support"]

[dependencies]
worth-ui-inspection = { path = "../worth-ui-inspection" }
worth-ui-runtime = { path = "../worth-ui-runtime" }
worth-ui-dsl = { path = "../worth-ui-dsl" }

[dev-dependencies]
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-relational = { path = "../../../../crates/worth-relational" }
worth-runtime-bridge = { path = "../../../../crates/worth-runtime-bridge" }
worth-signal = { path = "../../../../crates/worth-signal" }
worth-ui-query-binding = { path = "../worth-ui-query-binding", features = ["certification-construction"] }
worth-ui-runtime = { path = "../worth-ui-runtime", features = ["certification-support"] }
worth-ui-host-headless = { path = "../worth-ui-host-headless" }

[[test]]
name = "capability_contracts"
path = "tests/suites/capability_contracts.rs"

[[test]]
name = "registry_contracts"
path = "tests/suites/registry_contracts.rs"
