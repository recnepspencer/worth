[package]
workspace = "../.."
name = "worth-store-wal"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Roadmap 1 WAL-coordinated durable mode and semantic write-path contracts."

[dependencies]
sha2 = "0.10"
worth-store-authority.workspace = true
worth-store-contracts.workspace = true
worth-store-modes.workspace = true
worth-store-physical-format.workspace = true
worth-store-security.workspace = true

[features]
default = []
certification-authority = [
    "worth-store-security/certification-test-authority",
]

[dev-dependencies]
tempfile = "3"
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-store-aspect-native.workspace = true
worth-store-security = { path = "../worth-store-security", features = ["certification-test-authority"] }

[lints]
workspace = true
