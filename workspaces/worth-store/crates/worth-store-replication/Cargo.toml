[package]
workspace = "../.."
name = "worth-store-replication"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Roadmap 1 replication, capsules, export/import, and integrity verification."

[dependencies]
fs4 = "0.8"
sha2 = "0.10"
worth-proof = { path = "../../../../crates/worth-proof" }
worth-store-authority.workspace = true
worth-store-physical-backend.workspace = true
worth-store-physical-isolation.workspace = true
worth-store-security.workspace = true

[features]
default = []
certification-test-authority = []

[dev-dependencies]
tempfile = "3"
worth-store-security = { workspace = true, features = ["certification-test-authority"] }
worth-store-wal.workspace = true

[lints]
workspace = true
