[package]
"name" = "worth-store-court-application"
"autotests" = false
"publish" = false
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"version" = { "workspace" = true }
"license" = { "workspace" = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worth-query-host = { path = "../../../worth-query/crates/worth-query-host" }
worth-query-execution = { path = "../../../worth-query/crates/worth-query-execution" }
worth-query-testkit-host = { path = "../../../worth-query/crates/worth-query-testkit-host" }
worth-query-testkit-installation = { path = "../../../worth-query/crates/worth-query-testkit-installation" }
worth-store-testkit-application-oracle = { path = "../worth-store-testkit-application-oracle" }
worth-store-application = { path = "../worth-store-application", features = ["certification-test-authority"] }
worth-store-testkit-sweep = { path = "../worth-store-testkit-sweep" }
"sha2" = { "version" = "^0.10" }
"tempfile" = { "version" = "^3" }
"worth-execution" = { "path" = "../../../../crates/worth-execution" }
"worth-foundational" = { "path" = "../../../../crates/worth-foundational" }
"worth-proof" = { "path" = "../../../../crates/worth-proof" }
worth-signal = { path = "../../../../crates/worth-signal" }
worth-store-testkit-store = { path = "../worth-store-testkit-store" }
"worth-relational" = { "path" = "../../../../crates/worth-relational" }
worth-runtime-world = { path = "../../../../crates/worth-runtime-world" }
worth-runtime-bridge = { path = "../../../../crates/worth-runtime-bridge" }
"worth-store" = { "path" = "../worth-store" }
"worth-store-physical-format" = { "path" = "../worth-store-physical-format" }
"worth-store-relational" = { "path" = "../worth-store-relational", "features" = ["certification-test-authority"] }
"worth-store-testkit-executables" = { "path" = "../worth-store-testkit-executables" }

[[test]]
name = "worth_store_court_application"
path = "tests/worth_store_court_application.rs"

[lints]
workspace = true
