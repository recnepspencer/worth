[package]
workspace = "../.."
name = "worth-store-operations"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Roadmap 2 S.10 operational safety, backup, PITR, repair, and forensics."

[features]
default = []
certification-test-authority = [
    "worth-store-blob-chunks/certification-test-authority",
    "worth-store-security/certification-test-authority",
]

[dependencies]
sha2 = "0.10"
tempfile = "3"
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-store-aspect-native.workspace = true
worth-store-authority.workspace = true
worth-store-blob-chunks.workspace = true
worth-store-contracts.workspace = true
worth-store-io-scheduler.workspace = true
worth-store-layout-indexes.workspace = true
worth-store-offline-verifier.workspace = true
worth-store-physical-backend.workspace = true
worth-store-physical-format.workspace = true
worth-store-physical-integrity.workspace = true
worth-store-physical-isolation.workspace = true
worth-store-recovery-physics.workspace = true
worth-store-replication.workspace = true
worth-store-security.workspace = true
worth-store-tiering.workspace = true
worth-store-wal.workspace = true

[dev-dependencies]
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-store-aspect-native.workspace = true
worth-store-blob-chunks = { workspace = true, features = ["certification-test-authority"] }
worth-store-readiness.workspace = true
worth-store-physical-format.workspace = true
worth-store-physical-isolation = { workspace = true, features = ["certification-authority"] }
worth-store-test-support = { workspace = true, default-features = false, features = ["layout-fixtures"] }

[lints]
workspace = true
