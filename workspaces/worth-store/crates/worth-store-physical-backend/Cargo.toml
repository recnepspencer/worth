[package]
workspace = "../.."
name = "worth-store-physical-backend"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Internal OS-backed filesystem effects and media qualification for Worth Store."
publish = false

[dependencies]
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
fs4 = "0.8"
file-id = "0.2"
getrandom = "0.4"
same-file = "1.0.6"
sha2 = "0.10"
tempfile = "3"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk"] }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-foundational = { path = "../../../../crates/worth-foundational", optional = true }
worth-store-contracts.workspace = true
worth-store-authority.workspace = true
worth-store-physical-format.workspace = true
worth-store-security.workspace = true
worth-store-wal.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[dev-dependencies]
stats_alloc = "0.1.10"
worth-store-aspect-native.workspace = true
worth-store-security = { workspace = true, features = ["certification-test-authority"] }

[build-dependencies]
sha2 = "0.10"

[features]
store-runtime-owner = []
recovery-runtime-owner = []
certification-test-authority = [
    "store-runtime-owner",
    "dep:worth-foundational",
]

[lints]
workspace = true
