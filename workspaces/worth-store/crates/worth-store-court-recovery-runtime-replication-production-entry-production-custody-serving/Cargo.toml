[package]
"name" = "worth-store-court-recovery-runtime-replication-production-entry-production-custody-serving"
"autotests" = false
"publish" = false
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"version" = { "workspace" = true }
"license" = { "workspace" = true }

[dependencies]
"serde_json" = { "version" = "^1" }
"sha2" = { "version" = "^0.10" }
"tempfile" = { "version" = "^3" }
"worth-execution" = { "path" = "../../../../crates/worth-execution" }
"worth-foundational" = { "path" = "../../../../crates/worth-foundational" }
"worth-proof" = { "path" = "../../../../crates/worth-proof" }
"worth-relational" = { "path" = "../../../../crates/worth-relational" }
"worth-store" = { "path" = "../worth-store", "features" = ["certification-test-authority", "recovery-runtime-owner", "test-support", "volatile-sync-for-tests"] }
"worth-store-authority" = { "path" = "../worth-store-authority" }
"worth-store-blob-chunks" = { "path" = "../worth-store-blob-chunks" }
"worth-store-contracts" = { "path" = "../worth-store-contracts" }
"worth-store-formal-models" = { "path" = "../worth-store-formal-models" }
"worth-store-layout-indexes" = { "path" = "../worth-store-layout-indexes" }
"worth-store-lsm-authority" = { "path" = "../worth-store-lsm-authority" }
"worth-store-physical-backend" = { "path" = "../worth-store-physical-backend" }
"worth-store-physical-certification" = { "path" = "../worth-store-physical-certification" }
"worth-store-physical-format" = { "path" = "../worth-store-physical-format" }
"worth-store-physical-integrity" = { "path" = "../worth-store-physical-integrity", "features" = ["test-support"] }
"worth-store-physical-isolation" = { "path" = "../worth-store-physical-isolation" }
"worth-store-recovery-physics" = { "path" = "../worth-store-recovery-physics", "features" = ["test-support"] }
"worth-store-recovery-runtime" = { "path" = "../worth-store-recovery-runtime" }
"worth-store-security" = { "path" = "../worth-store-security" }
"worth-store-test-support" = { "path" = "../worth-store-test-support", "features" = ["certification-world", "layout-fixtures", "physical-compaction-fixtures", "recovery-runtime-fixtures"] }
"worth-store-testkit-executables" = { "path" = "../worth-store-testkit-executables" }
"worth-store-testkit-recovery-runtime" = { "path" = "../worth-store-testkit-recovery-runtime" }

[[test]]
name = "worth_store_court_recovery_runtime_replication_production_entry_production_custody_serving"
path = "tests/worth_store_court_recovery_runtime_replication_production_entry_production_custody_serving.rs"

[lints]
workspace = true
