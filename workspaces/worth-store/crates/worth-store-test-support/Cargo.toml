[package]
workspace = "../.."
name = "worth-store-test-support"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Narrow test fixtures and builders for the Worth Store rebuild workspace."

[features]
default = []
boundary-fixtures = [
    "dep:worth-foundational",
    "dep:worth-proof",
    "dep:worth-store-aspect-native",
    "dep:worth-store-contracts",
    "dep:worth-store-physical-format",
    "dep:worth-store-physical-isolation",
]
physical-residency-fixtures = [
    "boundary-fixtures",
    "dep:worth-store",
    "dep:worth-store-physical-backend",
]
scheduling-fixtures = [
    "boundary-fixtures",
    "dep:worth-store-io-scheduler",
    "dep:worth-store-security",
]
physical-isolation-fixtures = [
    "physical-residency-fixtures",
    "dep:worth-store-authority",
    "dep:worth-store-budgets",
    "dep:worth-store-compatibility",
    "dep:worth-store-physical-backend",
    "dep:worth-store-physical-integrity",
    "dep:worth-store-recovery-physics",
    "dep:worth-store-recovery-runtime",
    "worth-store-physical-isolation/certification-authority",
    "worth-store-recovery-runtime/certification-test-authority",
    "dep:worth-store-security",
    "dep:worth-store-wal",
]
recovery-runtime-fixtures = [
    "physical-isolation-fixtures",
    "worth-store/certification-test-authority",
]
physical-compaction-fixtures = [
    "physical-isolation-fixtures",
    "worth-store-physical-backend/certification-test-authority",
    "worth-store-physical-isolation/certification-authority",
    "worth-store-security/certification-test-authority",
    "worth-store-wal/certification-authority",
]
layout-fixtures = [
    "physical-isolation-fixtures",
    "dep:worth-store-layout-indexes",
    "dep:worth-store-lsm-authority",
]
certification-world = [
    "layout-fixtures",
    "physical-compaction-fixtures",
    "scheduling-fixtures",
    "dep:worth-store-blob-chunks",
    "dep:worth-store-physical-certification",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.0.1"
tempfile = "3"
worth-foundational = { path = "../../../../crates/worth-foundational", optional = true }
worth-proof = { path = "../../../../crates/worth-proof", optional = true }
worth-store = { workspace = true, optional = true }
worth-store-aspect-native = { workspace = true, optional = true }
worth-store-authority = { workspace = true, optional = true }
worth-store-blob-chunks = { workspace = true, features = ["certification-test-authority"], optional = true }
worth-store-budgets = { workspace = true, optional = true }
worth-store-contracts = { workspace = true, optional = true }
worth-store-compatibility = { workspace = true, optional = true }
worth-store-io-scheduler = { workspace = true, optional = true }
worth-store-layout-indexes = { workspace = true, optional = true }
worth-store-lsm-authority = { workspace = true, optional = true }
worth-store-physical-certification = { workspace = true, features = ["certification-test-support"], optional = true }
worth-store-physical-backend = { workspace = true, optional = true }
worth-store-physical-format = { workspace = true, optional = true }
worth-store-physical-integrity = { workspace = true, optional = true }
worth-store-physical-isolation = { workspace = true, optional = true }
worth-store-recovery-physics = { workspace = true, optional = true }
worth-store-recovery-runtime = { workspace = true, optional = true }
worth-store-security = { workspace = true, optional = true }
worth-store-wal = { workspace = true, optional = true }
[lints]
workspace = true
