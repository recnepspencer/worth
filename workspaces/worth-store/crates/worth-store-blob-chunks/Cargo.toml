[package]
workspace = "../.."
name = "worth-store-blob-chunks"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Roadmap 2 S.7 native content-addressed blob and object chunk store."

[features]
certification-test-authority = [
    "worth-store-io-scheduler/certification-test-authority",
    "worth-store-physical-backend/certification-test-authority",
    "worth-store-physical-isolation/certification-authority",
    "worth-store-reclaim-policy/certification-test-authority",
    "worth-store-tiering/certification-test-authority",
    "worth-store-test-support/physical-compaction-fixtures",
]

[dependencies]
sha2 = "0.10"
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-store-aspect-native.workspace = true
worth-store-budgets.workspace = true
worth-store-contracts.workspace = true
worth-store-authority.workspace = true
worth-store-io-scheduler.workspace = true
worth-store-physical-backend.workspace = true
worth-store-physical-format.workspace = true
worth-store-physical-isolation.workspace = true
worth-store-reclaim-policy.workspace = true
worth-store-retention.workspace = true
worth-store-security.workspace = true
worth-store-tiering.workspace = true
worth-store-wal.workspace = true
worth-store.workspace = true

[dev-dependencies]
tempfile = "3"
worth-store-aspect-native.workspace = true
worth-store-offline-verifier.workspace = true
worth-store-physical-backend = { workspace = true, features = ["certification-test-authority"] }
worth-store-io-scheduler = { workspace = true, features = ["certification-test-authority"] }
worth-store-physical-isolation = { workspace = true, features = ["certification-authority"] }
worth-store-reclaim-policy = { workspace = true, features = ["certification-test-authority"] }
worth-store-tiering = { workspace = true, features = ["certification-test-authority"] }
worth-store-test-support = { workspace = true, default-features = false, features = ["physical-isolation-fixtures"] }

[lints]
workspace = true
