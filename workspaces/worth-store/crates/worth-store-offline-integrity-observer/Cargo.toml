[package]
workspace = "../.."
name = "worth-store-offline-integrity-observer"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Independent bounded observation of inert WORTH Store physical artifacts."
autotests = false

[[bin]]
name = "physical_store_integrity_observer"
path = "src/bin/physical_store_integrity_observer.rs"

[[test]]
name = "observation_contracts"
path = "tests/observation_contracts.rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-store-physical-format.workspace = true

[lints]
workspace = true
