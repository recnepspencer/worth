[workspace]
resolver = "2"
members = [
    "crates/bank-courtroom",
    "crates/bank-domain",
    "crates/bank-estate-certification",
    "crates/bank-external-rail",
    "crates/bank-http-adapter",
    "crates/bank-server",
    "crates/bank-user-node",
]
default-members = [
    "crates/bank-domain",
    "crates/bank-estate-certification",
    "crates/bank-external-rail",
    "crates/bank-http-adapter",
    "crates/bank-server",
    "crates/bank-user-node",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "BUSL-1.1"

[workspace.dependencies]
worth-foundational = { path = "../../crates/worth-foundational" }
worth-query-decl = { path = "../worth-query/crates/worth-query-decl" }
worth-query-host = { path = "../worth-query/crates/worth-query-host" }
bank-domain = { path = "crates/bank-domain" }
bank-external-rail = { path = "crates/bank-external-rail" }
bank-server = { path = "crates/bank-server" }
bank-http-adapter = { path = "crates/bank-http-adapter" }
bank-user-node = { path = "crates/bank-user-node" }
axum = "0.8"
openidconnect = { version = "=4.0.1", features = ["timing-resistant-secret-traits"] }
rand = "0.8.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thirtyfour = { version = "=0.37.4", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 2
