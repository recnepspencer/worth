# WORTH uses explicit semantic inputs for proof construction and typed outcome
# topologies whose variants intentionally carry complete recovery evidence.
# Keep these generic Clippy heuristics bounded above the largest reviewed
# ordinary surface; repository-specific function scrutiny and the 400-line
# guard remain the composition enforcement.
too-many-arguments-threshold = 32
enum-variant-size-threshold = 32768
type-complexity-threshold = 512
# Geometry mints carry reviewed expectations at their owning call sites.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "wall time is sampled by the reviewed Execution clock adapter" },
  { path = "std::time::Instant::now", reason = "monotonic time is sampled by the reviewed Execution clock adapter" },
  { path = "jiff::Zoned::now", reason = "local time is derived from sampled wall time and an explicit calendar" },
  { path = "chrono::Utc::now", reason = "wall time is sampled by the reviewed Execution clock adapter" },
  { path = "std::thread::spawn", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution" },
  { path = "std::thread::scope", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution" },
  { path = "std::thread::Builder::new", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution" },
  { path = "std::thread::Builder::spawn", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution" },
  { path = "std::thread::Builder::spawn_scoped", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution" },
  { path = "std::thread::Scope::spawn", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution" },
  { path = "tokio::task::spawn_blocking", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution", allow-invalid = true },
  { path = "tokio::runtime::Builder::new_current_thread", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution", allow-invalid = true },
  { path = "tokio::runtime::Builder::new_multi_thread", reason = "Threads and async executors belong only to the reviewed owning sites; computation belongs to worth-execution", allow-invalid = true },
]

# StructuralWalkKey::identity/Eq/Ord use only immutable query parameters.
# Its retained allocation ticket carries a mutable ledger, never key meaning.
# Keep the default Bytes exception and scope the additional exception to this
# exact private key; key_ordering_tests proves lookup while that ledger changes.
# https://clippy.rust-lang.org/rust-1.94.0/index.html#mutable_key_type
ignore-interior-mutability = [
  # These keys compare immutable meaning; retained funding and binding caches do not participate.
  "worth_relational::graph_member::key::projected_storage::ProjectedMemberStorage",
  "worth_relational::validation::candidate_source::program::ManagedIndexSourceProgram",
  "bytes::Bytes",
  "worth_query_execution::domain_computation::primary_graph::structural_walk::key::StructuralWalkKey",
  # ordering_coordinates/Hash inspect fixed coordinates and meaning identity,
  # never retained footprint custody or its shared owner/ledger state.
  "worth_query_execution::domain_computation::primary_graph::application_query::observed_source::source_identity::WorthQueryObservedSourceEpoch",
]
