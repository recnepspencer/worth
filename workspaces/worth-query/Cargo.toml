[workspace]
resolver = "2"
members = [
    "crates/worth-query",
    "crates/worth-query-decl",
    "crates/worth-query-host",
    "crates/worth-query-replay",
    "crates/worth-query-certification",
    "crates/worth-query-declaration",
    "crates/worth-query-installation",
    "crates/worth-query-package-archive",
    "crates/worth-query-admission",
    "crates/worth-query-execution",
    "crates/worth-query-publication",
]
default-members = [
    "crates/worth-query",
    "crates/worth-query-decl",
    "crates/worth-query-host",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "BUSL-1.1"

[workspace.dependencies]
worth-query = { path = "crates/worth-query" }
worth-query-decl = { path = "crates/worth-query-decl" }
worth-query-host = { path = "crates/worth-query-host" }
worth-query-replay = { path = "crates/worth-query-replay" }
worth-query-certification = { path = "crates/worth-query-certification" }
worth-query-declaration = { path = "crates/worth-query-declaration" }
worth-query-installation = { path = "crates/worth-query-installation" }
worth-query-package-archive = { path = "crates/worth-query-package-archive" }
worth-query-admission = { path = "crates/worth-query-admission" }
worth-query-execution = { path = "crates/worth-query-execution" }
worth-query-publication = { path = "crates/worth-query-publication" }

worth-foundational = { path = "../../crates/worth-foundational" }
worth-proof = { path = "../../crates/worth-proof" }
worth-relational = { path = "../../crates/worth-relational" }
worth-runtime-bridge = { path = "../../crates/worth-runtime-bridge" }
worth-signal = { path = "../../crates/worth-signal" }
worth-schema-graph = { path = "../worth-contracts/crates/worth-schema-graph" }

arc-swap = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"
# Query's counters are phase-carried proof objects whose fields are incremented
# where work occurs; forcing one initializer would hide that phase ownership.
field_reassign_with_default = "allow"
# Public outcome vocabulary intentionally retains domain qualifiers, and nested
# topology may repeat the semantic root when the hierarchy owns distinct fates.
enum_variant_names = "allow"
module_inception = "allow"
# Domain transition verbs such as `from_*` are not collection conversions and
# may borrow the authority-bearing receiver that performs the transition.
wrong_self_convention = "allow"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 2

[profile.perf]
inherits = "dev"
opt-level = 2
