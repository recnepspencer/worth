[workspace]
resolver = "3"
members = [
    "topology_entry",
    "parameter_entry",
    "consumer_root",
    "hostile_foreign_schema",
]
default-members = ["consumer_root"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
worth-query-consumer-values = { path = "../consumer_values" }
worth-query-topology-entry = { path = "topology_entry" }
worth-query-parameter-entry = { path = "parameter_entry" }
worth-query-decl = { path = "../../../worth-query-decl" }
worth-query-host = { path = "../../../worth-query-host" }
serde = { version = "1", features = ["derive"] }

# Match the Query workspace's compilation profile so the external consumer can
# reuse its owner artifacts without full-debug or optimized Query recompilation.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package]
"*".opt-level = 2
# Query and its path foundations are dependencies here, rather than members.
# Keep their existing normal owner profile; third-party dependencies stay at 2.
worth-query-declaration.opt-level = 0
worth-query-installation.opt-level = 0
worth-query-decl.opt-level = 0
worth-query-admission.opt-level = 0
worth-query-execution.opt-level = 0
worth-query-publication.opt-level = 0
worth-query-host.opt-level = 0
worth-proof.opt-level = 0
worth-foundational.opt-level = 0
worth-execution.opt-level = 0
worth-relational.opt-level = 0
worth-signal.opt-level = 0
worth-runtime-bridge.opt-level = 0
worth-runtime-world.opt-level = 0
# The topology-entry lib-test binary links the whole primary-graph owner; its
# line tables pass the 4 GiB PDB limit, so rust-lld cannot link it on Windows.
# Query builds worth-query-execution without debug info for the same reason.
# Panic locations stay exact.
worth-query-execution.debug = false
worth-query-topology-entry.debug = false

[profile.test]
opt-level = 0

[profile.test.package]
"*".opt-level = 2
worth-query-declaration.opt-level = 0
worth-query-installation.opt-level = 0
worth-query-decl.opt-level = 0
worth-query-admission.opt-level = 0
worth-query-execution.opt-level = 0
worth-query-publication.opt-level = 0
worth-query-host.opt-level = 0
worth-proof.opt-level = 0
worth-foundational.opt-level = 0
worth-execution.opt-level = 0
worth-relational.opt-level = 0
worth-signal.opt-level = 0
worth-runtime-bridge.opt-level = 0
worth-runtime-world.opt-level = 0
# Topology-entry symbols exceed the PDB limit; see [profile.dev.package].
worth-query-execution.debug = false
worth-query-topology-entry.debug = false
