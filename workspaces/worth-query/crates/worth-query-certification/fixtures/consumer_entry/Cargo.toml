[workspace]
resolver = "3"
members = [
    "topology_entry",
    "parameter_entry",
    "consumer_root",
    "hostile_foreign_schema",
]
default-members = ["consumer_root"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
worth-query-consumer-values = { path = "../consumer_values" }
worth-query-topology-entry = { path = "topology_entry" }
worth-query-parameter-entry = { path = "parameter_entry" }
worth-query-decl = { path = "../../../worth-query-decl" }
worth-query-host = { path = "../../../worth-query-host" }
serde = { version = "1", features = ["derive"] }

# Match the Query workspace's compilation profile so the external consumer can
# reuse its owner artifacts without full-debug or optimized Query recompilation.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.worth-query-decl]
opt-level = 0
[profile.dev.package.worth-query-host]
opt-level = 0
[profile.dev.package.worth-query-declaration]
opt-level = 0
[profile.dev.package.worth-query-installation]
opt-level = 0
[profile.dev.package.worth-query-admission]
opt-level = 0
[profile.dev.package.worth-query-execution]
opt-level = 0
[profile.dev.package.worth-query-publication]
opt-level = 0
[profile.dev.package.worth-execution]
opt-level = 0
[profile.dev.package.worth-foundational]
opt-level = 0
[profile.dev.package.worth-proof]
opt-level = 0
[profile.dev.package.worth-query-consumer-values]
opt-level = 0
[profile.dev.package.worth-relational]
opt-level = 0
[profile.dev.package.worth-runtime-bridge]
opt-level = 0
[profile.dev.package.worth-runtime-world]
opt-level = 0
[profile.dev.package.worth-signal]
opt-level = 0
