[package]
name = "worth-query-certification"
autotests = false
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Bounded hostile and replay certification for WORTH Query."
publish = false

[dependencies]
worth-query-host.workspace = true
worth-query-replay.workspace = true

[dev-dependencies]
worth-foundational.workspace = true
worth-query.workspace = true
worth-query-decl.workspace = true
worth-query-admission = { path = "../worth-query-admission" }
worth-query-execution = { path = "../worth-query-execution", features = ["test-durability-faults", "test-primary-graph-faults", "test-world-operation-control"] }
worth-query-installation = { path = "../worth-query-installation", features = ["certification-query-lookup"] }
worth-proof.workspace = true
worth-relational.workspace = true
worth-runtime-bridge.workspace = true
worth-signal.workspace = true

[[test]]
name = "composition_guards"
path = "tests/composition_guards.rs"

[[test]]
name = "installed_audience_journey"
path = "tests/pass/installed_audience_journey.rs"
harness = false

[[test]]
name = "temporal_conditional_oracle_parity"
path = "tests/temporal_conditional_oracle_parity.rs"

[[test]]
name = "granular_invalidation"
path = "tests/granular_invalidation.rs"

[[test]]
name = "runtime_world_branching"
path = "tests/runtime_world_branching.rs"

[[example]]
name = "ordinary_product_workflow"
path = "examples/ordinary_product_workflow.rs"
test = true
harness = false

[[example]]
name = "advanced_product_branching"
path = "examples/advanced_product_branching.rs"
test = true
harness = false


[lints]
workspace = true
