[package]
name = "worth-query-installation"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Portable domain package and installed identity authority for Worth Query."

[dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = "0.12"
serde = "1"
sha2 = "0.10"
subtle = "2.6"
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-query-declaration = { path = "../worth-query-declaration" }
zeroize = "1.8"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
