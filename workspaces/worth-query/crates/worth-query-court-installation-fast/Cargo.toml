[package]
name = "worth-query-court-installation-fast"
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[package.metadata.worth.court]
boundary = "installation"
class = "fast"

[dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-query-declaration = { path = "../worth-query-declaration" }
worth-query-installation = { path = "../worth-query-installation" }
worth-query-worlds = { path = "../worth-query-worlds" }
zeroize = "1.8"

[lints]
workspace = true

[[test]]
name = "worth_query_court_installation_fast"
path = "tests/worth_query_court_installation_fast.rs"
