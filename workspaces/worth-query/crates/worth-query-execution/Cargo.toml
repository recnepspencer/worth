[package]
name = "worth-query-execution"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Installed Query execution authority over admitted plans."
publish = false

[features]
allocation-probes = []
test-durability-faults = ["worth-relational/test-durability-faults"]
test-primary-graph-faults = []
test-world-operation-control = ["worth-runtime-world/test-operation-control"]

[dependencies]
sha2 = "0.10"
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-relational = { path = "../../../../crates/worth-relational" }
worth-runtime-bridge = { path = "../../../../crates/worth-runtime-bridge" }
worth-runtime-world = { path = "../../../../crates/worth-runtime-world" }
worth-signal = { path = "../../../../crates/worth-signal" }
worth-query-admission = { path = "../worth-query-admission" }
worth-query-declaration = { path = "../worth-query-declaration" }
worth-query-installation = { path = "../worth-query-installation" }

[dev-dependencies]
serde_json = "1"
stats_alloc = "0.1"
worth-relational = { path = "../../../../crates/worth-relational", features = ["test-durability-faults"] }
worth-query-installation = { path = "../worth-query-installation", features = ["certification-query-lookup"] }

[lints]
workspace = true
