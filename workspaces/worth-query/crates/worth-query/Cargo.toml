[package]
name = "worth-query"
autotests = false
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Canonical typed query artifact authority for Worth."
repository = "https://github.com/recnepspencer/WORTH"
keywords = ["query", "canonicalization", "facade", "typed"]
categories = ["data-structures", "science"]

[dependencies]
arc-swap = "1"
worth-query-declaration = { path = "../worth-query-declaration" }
worth-query-installation = { path = "../worth-query-installation" }
worth-query-admission = { path = "../worth-query-admission" }
worth-query-execution = { path = "../worth-query-execution" }
worth-query-publication = { path = "../worth-query-publication" }
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-relational = { path = "../../../../crates/worth-relational" }
worth-runtime-bridge = { path = "../../../../crates/worth-runtime-bridge" }
worth-signal = { path = "../../../../crates/worth-signal" }
worth-schema-graph.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[[test]]
name = "public_declarative_journeys"
path = "tests/public_declarative_journeys.rs"

[[test]]
name = "runtime_public_journeys"
path = "tests/runtime_public_journeys.rs"

[[test]]
name = "installed_operating_world"
path = "tests/installed_operating_world.rs"

[lints]
workspace = true

[dev-dependencies]
worth-runtime-bridge = { path = "../../../../crates/worth-runtime-bridge", features = ["certification-construction"] }
worth-relational = { path = "../../../../crates/worth-relational", features = ["test-durability-faults"] }
worth-query-installation = { path = "../worth-query-installation", features = ["certification-query-lookup"] }
